name: Notify on new post
on:
  push:
    branches: [main]
    paths:
      - "posts/*.html"
      - "posts.json"
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -X POST "https://the-final-third19.vercel.app/api/broadcast?key=${{ secrets.BROADCAST_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"title":"New Match Analysis","body":"A new post-match analysis is live!","url":"/"}'
