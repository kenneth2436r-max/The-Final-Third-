<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Mbappé 1-0 (45')</text>

  <!-- Pitch top-down half -->
  <rect x="30" y="40" width="540" height="320" fill="none" stroke="#22c55e" stroke-width="1.5" rx="3"/>
  <rect x="30" y="40" width="270" height="320" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
  <rect x="510" y="40" width="60" height="320" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <!-- Goal box -->
  <rect x="530" y="110" width="40" height="180" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <!-- 6-yard box -->
  <rect x="550" y="150" width="20" height="100" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- Corner arc -->
  <path d="M 540 360 Q 540 340 560 340" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- Short corner assist area -->
  <circle cx="510" cy="345" r="6" fill="#22c55e" opacity="0.4"/>
  <text x="500" y="370" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Dembélé</text>

  <!-- Pass line: short corner -->
  <line x1="510" y1="345" x2="435" y2="310" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <polygon points="435,310 440,305 432,306" fill="#e6edf3" opacity="0.7"/>

  <!-- Mbappé position -->
  <circle cx="435" cy="310" r="7" fill="#22c55e" opacity="0.5"/>
  <text x="435" y="300" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Mbappé</text>

  <!-- Curling shot trajectory -->
  <path d="M 435 310 C 460 270, 500 210, 555 185" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="555,185 548,188 551,181" fill="#22c55e"/>

  <!-- Goal net -->
  <text x="560" y="180" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">⚽</text>

  <!-- Scoreboard -->
  <rect x="200" y="370" width="200" height="22" rx="4" fill="#1a3c2a" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="385" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11" font-weight="bold">FRA 1-0 SWE · 45'</text>

  <!-- Label -->
  <text x="150" y="80" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="9" opacity="0.7">Short corner → curling finish</text>
</svg>
