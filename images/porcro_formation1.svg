  <path d="M 590 0 A 10 10 0 0 1 600 10" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.3"/>
  <path d="M 600 390 A 10 10 0 0 1 590 400" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.3"/>
  <path d="M 10 400 A 10 10 0 0 1 0 390" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.3"/>
