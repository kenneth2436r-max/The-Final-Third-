<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- PITCH MARKINGS -->
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
