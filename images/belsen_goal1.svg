<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Full pitch background -->
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>

  <!-- Pitch markings -->
  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#fff" stroke-width="1.5" rx="4" opacity="0.45"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-width="1" opacity="0.45"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="4" fill="#fff" opacity="0.35"/>
  <rect x="40" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="40" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="510" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <!-- Goals -->
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <rect x="557" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- Event location marker - Mané cross from left wing -->
  <circle cx="100" cy="120" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="100" cy="120" r="12" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>

  <!-- Mané position -->
  <circle cx="100" cy="120" r="16" fill="#0d1117" stroke="#22c55e" stroke-width="2"/>
  <text x="100" y="114" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Mané</text>
  <text x="100" y="124" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">cross</text>

  <!-- Cross arrow -->
  <path d="M 110 125 Q 170 100 200 110" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="200,110 192,104 194,116" fill="#22c55e"/>
  <circle cx="200" cy="110" r="5" fill="#fff"/>

  <!-- Sarr header position (penalty box) -->
  <circle cx="210" cy="150" r="16" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/>
  <text x="210" y="145" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Sarr</text>
  <text x="210" y="155" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">header</text>

  <path d="M 215 158 Q 200 180 175 175" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="175,175 183,180 182,170" fill="#e6edf3"/>

  <!-- Post hit -->
  <text x="165" y="172" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">POST</text>

  <!-- Diarra tap-in position -->
  <circle cx="85" cy="175" r="16" fill="#0d1117" stroke="#22c55e" stroke-width="2"/>
  <text x="85" y="170" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Diarra</text>
  <text x="85" y="180" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">tap-in</text>

  <path d="M 165 176 Q 130 178 100 178" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="100,178 108,182 108,174" fill="#22c55e"/>

  <path d="M 85 190 Q 75 195 70 198" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polygon points="70,198 78,202 78,194" fill="#22c55e"/>

  <!-- Goal glow -->
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="39" y="205" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">G</text>

  <!-- Score -->
  <rect x="230" y="8" width="140" height="24" rx="12" fill="#000" opacity="0.6"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">BEL 0-1 SEN</text>

  <!-- Event description -->
  <rect x="120" y="360" width="360" height="30" rx="6" fill="#000" opacity="0.6"/>
  <text x="300" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="11">25' Diarra scores at far post after Sarr hits the post</text>

  <!-- Timer -->
  <rect x="490" y="45" width="55" height="22" rx="11" fill="#000" opacity="0.6"/>
  <text x="517" y="60" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">25'</text>
</svg>
