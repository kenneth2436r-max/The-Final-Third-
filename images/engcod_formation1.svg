<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- Pitch half (attacking right) -->
  <rect x="300" y="40" width="260" height="320" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="300" cy="200" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="440" y="90" width="120" height="220" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="487" y="130" width="73" height="140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="16" font-weight="bold">England 4-2-3-1</text>
  <!-- GK - Pickford -->
  <circle cx="490" cy="200" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="490" y="196" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Pickford</text>
  <text x="490" y="206" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">GK</text>
  <!-- DEF - Spence -->
  <circle cx="430" cy="120" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="430" y="116" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Spence</text>
  <text x="430" y="126" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">RB</text>
  <!-- DEF - Konsa -->
  <circle cx="455" cy="160" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="455" y="156" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Konsa</text>
  <text x="455" y="166" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">CB</text>
  <!-- DEF - Guehi -->
  <circle cx="455" cy="240" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="455" y="236" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Guéhi</text>
  <text x="455" y="246" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">CB</text>
  <!-- DEF - O'Reilly -->
  <circle cx="430" cy="280" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="430" y="276" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">O'Reilly</text>
  <text x="430" y="286" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">LB</text>
  <!-- CDM - Anderson -->
  <circle cx="385" cy="170" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="385" y="166" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Anderson</text>
  <text x="385" y="176" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">CDM</text>
  <!-- CDM - Rice (c) -->
  <circle cx="385" cy="230" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="385" y="226" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Rice</text>
  <text x="385" y="236" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">CDM</text>
  <!-- AM - Madueke -->
  <circle cx="340" cy="130" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="340" y="126" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Madueke</text>
  <text x="340" y="136" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">RW</text>
  <!-- AM - Bellingham -->
  <circle cx="340" cy="200" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="340" y="196" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Bellingham</text>
  <text x="340" y="206" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">CAM</text>
  <!-- AM - Rashford -->
  <circle cx="340" cy="270" r="14" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="340" y="266" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="8">Rashford</text>
  <text x="340" y="276" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">LW</text>
  <!-- ST - Kane (captain) -->
  <circle cx="295" cy="200" r="15" fill="#f0f0f0" stroke="#0022aa" stroke-width="2"/>
  <text x="295" y="196" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="9" font-weight="bold">Kane</text>
  <text x="295" y="206" text-anchor="middle" fill="#0022aa" font-family="Arial,sans-serif" font-size="7">ST</text>
  <!-- Legend -->
  <text x="40" y="370" fill="#ffffff" opacity="0.6" font-family="Arial,sans-serif" font-size="9">4-2-3-1 — Attacking Midfield — Captain: Rice</text>
</svg>