<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
  <!-- Full pitch top-down -->
  <rect x="50" y="60" width="500" height="280" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.2"/>
  <line x1="300" y1="60" x2="300" y2="340" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="200" r="35" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <!-- Penalty areas -->
  <rect x="50" y="105" width="100" height="190" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <rect x="450" y="105" width="100" height="190" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <rect x="50" y="140" width="55" height="120" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.1"/>
  <rect x="495" y="140" width="55" height="120" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.1"/>
  <!-- Goal -->
  <rect x="50" y="175" width="10" height="50" fill="none" stroke="#e6edf3" stroke-width="1.5"/>
  <!-- Cipenga starting position (left wing) -->
  <circle cx="180" cy="260" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="180" y="276" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="8">Cipenga</text>
  <!-- Dribble path - curving in from left -->
  <path d="M 180,260 Q 200,240 200,210 Q 200,190 180,190 Q 160,190 120,195" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- Shot trajectory -->
  <line x1="120" y1="195" x2="60" y2="190" stroke="#ff6b35" stroke-width="2.5" marker-end="url(#arrowShot)"/>
  <!-- Ball -->
  <circle cx="60" cy="190" r="5" fill="#fff" stroke="#ff6b35" stroke-width="1.5"/>
  <!-- Pickford -->
  <text x="80" y="180" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="7">Pickford</text>
  <!-- Defenders -->
  <text x="120" y="135" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="7">ENG DEF</text>
  <!-- Score banner -->
  <rect x="200" y="65" width="200" height="28" rx="4" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="84" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="14" font-weight="bold">ENG 0-1 COD  |  7'</text>
  <!-- Timer -->
  <rect x="410" y="65" width="60" height="28" rx="4" fill="#ff6b35" opacity="0.2" stroke="#ff6b35" stroke-width="1"/>
  <text x="440" y="84" text-anchor="middle" fill="#ff6b35" font-family="Arial,sans-serif" font-size="12" font-weight="bold">7'</text>
  <!-- Marker arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#22c55e"/>
    </marker>
    <marker id="arrowShot" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ff6b35"/>
    </marker>
  </defs>
  <!-- Description -->
  <text x="300" y="370" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="10">Cipenga cut in from left wing, drove past defenders and fired past Pickford at near post.</text>
</svg>