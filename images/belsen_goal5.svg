<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Pitch from above (focused on goal area) -->
  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="4" fill="#30363d"/>
  
  <!-- Goal (Senegal side - right) -->
  <rect x="535" y="165" width="25" height="70" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- Penalty area right -->
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Penalty spot -->
  <circle cx="510" cy="200" r="5" fill="#e6edf3"/>
  <text x="510" y="188" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PEN</text>
  
  <!-- Goalkeeper diving left -->
  <circle cx="555" cy="215" r="14" fill="#1a2332" stroke="#e6edf3" stroke-width="2"/>
  <text x="555" y="219" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8">Diaw</text>
  
  <!-- GK dive arrow -->
  <path d="M 545 210 Q 552 220 558 225" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="558,225 549,225 554,217" fill="#e6edf3"/>
  
  <!-- Ball going right (bottom corner) -->
  <path d="M 510 200 Q 525 210 545 225" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <polygon points="545,225 535,225 542,218" fill="#22c55e"/>
  
  <!-- Ball -->
  <circle cx="528" cy="212" r="5" fill="#e6edf3"/>
  
  <!-- Goal text -->
  <rect x="535" y="165" width="25" height="70" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="548" y="203" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="16">G</text>
  
  <!-- Score -->
  <text x="300" y="30" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="16" font-weight="bold">BEL 3-2 SEN</text>
  <text x="300" y="385" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">120+5' Tielemans penalty (2nd goal) — GK sends wrong way</text>
  
  <!-- Timer -->
  <rect x="460" y="45" width="85" height="22" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="502" y="60" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">120+5'</text>
</svg>
