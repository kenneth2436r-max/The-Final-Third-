<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Argentina 4-4-2</text>
  
  <!-- Pitch -->
  <rect x="40" y="50" width="520" height="320" fill="none" stroke="#30363d" stroke-width="2" rx="6"/>
  <rect x="40" y="130" width="520" height="160" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6,4"/>
  <circle cx="300" cy="210" r="30" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="300" y1="50" x2="300" y2="370" stroke="#30363d" stroke-width="1"/>
  
  <!-- Penalty area ARG right side -->
  <rect x="440" y="145" width="120" height="130" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="470" y="175" width="90" height="70" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Penalty area CPV left side -->
  <rect x="40" y="145" width="120" height="130" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="175" width="90" height="70" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- GK: E. Martínez -->
  <circle cx="500" cy="210" r="16" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="214" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Martínez</text>
  
  <!-- DEF: Molina, Romero, L. Martínez, Medina -->
  <circle cx="400" cy="140" r="14" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="144" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Molina</text>
  
  <circle cx="420" cy="210" r="14" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="420" y="214" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Romero</text>
  
  <circle cx="420" cy="270" r="14" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="420" y="274" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">L.Martínez</text>
  
  <circle cx="400" cy="280" r="14" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="284" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Medina</text>
  
  <!-- MID: De Paul, Fernández, Mac Allister, Almada -->
  <circle cx="320" cy="160" r="14" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="164" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9">De Paul</text>
  
  <circle cx="310" cy="210" r="14" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="310" y="214" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9">Fernández</text>
  
  <circle cx="310" cy="260" r="14" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="310" y="264" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9">Mac Allister</text>
  
  <circle cx="320" cy="310" r="14" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="314" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9">Almada</text>
  
  <!-- FWD: Messi (c), L. Martínez -->
  <circle cx="220" cy="190" r="18" fill="#22c55e" fill-opacity="0.35" stroke="#22c55e" stroke-width="2.5"/>
  <text x="220" y="194" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Messi (c)</text>
  
  <circle cx="230" cy="260" r="14" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="230" y="264" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">L.Martínez</text>
  
  <!-- Attacking direction indicator -->
  <text x="60" y="90" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">▼ ATT</text>
  
  <style>
    text { dominant-baseline: central; }
  </style>
</svg>