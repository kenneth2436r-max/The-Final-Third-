<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
  <!-- Title -->
  <text x="300" y="50" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Match Statistics</text>
  <!-- Legend -->
  <rect x="130" y="62" width="10" height="10" fill="#22c55e" opacity="0.8"/>
  <text x="145" y="71" fill="#22c55e" font-family="Arial,sans-serif" font-size="10">England</text>
  <rect x="330" y="62" width="10" height="10" fill="#e6edf3" opacity="0.5"/>
  <text x="345" y="71" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">DR Congo</text>

  <!-- Stats layout: label left, bars right -->
  <!-- Categories, values, and bar widths -->
  <!-- Possession -->
  <text x="50" y="105" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Possession</text>
  <text x="50" y="118" fill="#8b949e" font-family="Arial,sans-serif" font-size="9">53% — 37%</text>
  <rect x="180" y="98" width="159" height="14" rx="3" fill="#22c55e" opacity="0.8"/>
  <rect x="339" y="98" width="111" height="14" rx="3" fill="#e6edf3" opacity="0.5"/>

  <!-- Shots -->
  <text x="50" y="153" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Shots</text>
  <text x="50" y="166" fill="#8b949e" font-family="Arial,sans-serif" font-size="9">16 — 7</text>
  <rect x="180" y="146" width="192" height="14" rx="3" fill="#22c55e" opacity="0.8"/>
  <rect x="372" y="146" width="84" height="14" rx="3" fill="#e6edf3" opacity="0.5"/>

  <!-- Shots on target -->
  <text x="50" y="201" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Shots on target</text>
  <text x="50" y="214" fill="#8b949e" font-family="Arial,sans-serif" font-size="9">7 — 2</text>
  <rect x="180" y="194" width="168" height="14" rx="3" fill="#22c55e" opacity="0.8"/>
  <rect x="348" y="194" width="48" height="14" rx="3" fill="#e6edf3" opacity="0.5"/>

  <!-- xG -->
  <text x="50" y="249" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Expected Goals (xG)</text>
  <text x="50" y="262" fill="#8b949e" font-family="Arial,sans-serif" font-size="9">2.16 — 0.77</text>
  <rect x="180" y="242" width="173" height="14" rx="3" fill="#22c55e" opacity="0.8"/>
  <rect x="353" y="242" width="62" height="14" rx="3" fill="#e6edf3" opacity="0.5"/>

  <!-- Passes -->
  <text x="50" y="297" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Passes</text>
  <text x="50" y="310" fill="#8b949e" font-family="Arial,sans-serif" font-size="9">523 — 392</text>
  <rect x="180" y="290" width="180" height="14" rx="3" fill="#22c55e" opacity="0.8"/>
  <rect x="360" y="290" width="135" height="14" rx="3" fill="#e6edf3" opacity="0.5"/>

  <!-- Corners -->
  <text x="50" y="345" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Corners</text>
  <text x="50" y="358" fill="#8b949e" font-family="Arial,sans-serif" font-size="9">5 — 3</text>
  <rect x="180" y="338" width="100" height="14" rx="3" fill="#22c55e" opacity="0.8"/>
  <rect x="280" y="338" width="60" height="14" rx="3" fill="#e6edf3" opacity="0.5"/>
</svg>