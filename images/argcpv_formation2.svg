<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- PITCH MARKINGS -->
  <rect x="40" y="50" width="520" height="320" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2" rx="6"/>
  <rect x="40" y="130" width="520" height="160" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="7,5"/>
  <circle cx="300" cy="210" r="30" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="300" y1="50" x2="300" y2="370" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="440" y="145" width="120" height="130" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="470" y="175" width="90" height="70" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="555" y="182" width="6" height="56" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="40" y="145" width="120" height="130" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="40" y="175" width="90" height="70" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="39" y="182" width="6" height="56" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="300" cy="210" r="2" fill="#fff" fill-opacity="0.4"/>
  <circle cx="500" cy="210" r="2" fill="#fff" fill-opacity="0.4"/>
  <circle cx="100" cy="210" r="2" fill="#fff" fill-opacity="0.4"/>

  <text x="300" y="28" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Cape Verde 4-3-3</text>

  <!-- GK: Vozinha (yellow kit) -->
  <circle cx="100" cy="210" r="16" fill="#f5c842" stroke="#d4a830" stroke-width="2"/>
  <text x="100" y="214" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Vozinha</text>

  <!-- DEF - Green kits -->
  <circle cx="190" cy="140" r="14" fill="#006600" stroke="#004d00" stroke-width="2"/>
  <text x="190" y="128" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" style="text-shadow:1px 1px 2px #000;">Moreira</text>

  <circle cx="180" cy="210" r="14" fill="#006600" stroke="#004d00" stroke-width="2"/>
  <text x="180" y="196" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" style="text-shadow:1px 1px 2px #000;">Borges</text>

  <circle cx="180" cy="270" r="14" fill="#006600" stroke="#004d00" stroke-width="2"/>
  <text x="180" y="256" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" style="text-shadow:1px 1px 2px #000;">P.Lopes</text>

  <circle cx="190" cy="310" r="14" fill="#006600" stroke="#004d00" stroke-width="2"/>
  <text x="190" y="296" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" style="text-shadow:1px 1px 2px #000;">Lopes Cabral</text>

  <!-- MID -->
  <circle cx="290" cy="175" r="14" fill="#006600" stroke="#004d00" stroke-width="1.5"/>
  <text x="290" y="161" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" style="text-shadow:1px 1px 2px #000;">Pina</text>

  <circle cx="300" cy="240" r="14" fill="#006600" stroke="#004d00" stroke-width="1.5"/>
  <text x="300" y="226" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" style="text-shadow:1px 1px 2px #000;">D.Duarte</text>

  <circle cx="290" cy="300" r="14" fill="#006600" stroke="#004d00" stroke-width="1.5"/>
  <text x="290" y="286" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" style="text-shadow:1px 1px 2px #000;">L.Duarte</text>

  <!-- FWD -->
  <circle cx="390" cy="160" r="14" fill="#006600" stroke="#004d00" stroke-width="2"/>
  <text x="390" y="146" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" style="text-shadow:1px 1px 2px #000;">J.Cabral</text>

  <circle cx="400" cy="225" r="18" fill="#006600" stroke="#004d00" stroke-width="2.5"/>
  <text x="400" y="208" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" style="text-shadow:1px 1px 2px #000;">Mendes (c)</text>

  <circle cx="390" cy="290" r="14" fill="#006600" stroke="#004d00" stroke-width="2"/>
  <text x="390" y="276" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" style="text-shadow:1px 1px 2px #000;">da Costa</text>

  <text x="525" y="95" text-anchor="end" fill="#fff" fill-opacity="0.5" font-family="Arial, sans-serif" font-size="10">◀ ATT</text>

  <style>
    text { dominant-baseline: central; }
  </style>
</svg>