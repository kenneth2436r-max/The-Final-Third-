<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Pitch from above -->
  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="4" fill="#30363d"/>
  
  <!-- Goal (Senegal side - right) -->
  <rect x="535" y="165" width="25" height="70" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- Penalty area right -->
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Meunier on right -->
  <circle cx="470" cy="250" r="14" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="470" y="244" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Meunier</text>
  <text x="470" y="254" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">cross</text>
  
  <!-- Cross arrow -->
  <path d="M 480 245 Q 510 200 500 170" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="500,170 495,179 506,177" fill="#22c55e"/>
  
  <!-- Ball -->
  <circle cx="505" cy="200" r="5" fill="#e6edf3"/>
  
  <!-- Lukaku position -->
  <circle cx="510" cy="165" r="16" fill="#1a2332" stroke="#22c55e" stroke-width="2.5"/>
  <text x="510" y="159" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Lukaku</text>
  <text x="510" y="170" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">header</text>
  
  <!-- Header direction into goal -->
  <path d="M 530 170 Q 540 180 550 185" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polygon points="550,185 541,183 544,191" fill="#22c55e"/>
  
  <!-- Goal -->
  <rect x="535" y="165" width="25" height="70" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="548" y="203" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="16">G</text>
  
  <!-- Diaw keeper -->
  <circle cx="560" cy="200" r="12" fill="#1a2332" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="560" y="204" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7">Diaw</text>
  
  <!-- Score -->
  <text x="300" y="30" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BEL 1-2 SEN</text>
  <text x="300" y="385" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">86' Lukaku header from Meunier's cross</text>
  
  <!-- Timer -->
  <rect x="490" y="45" width="55" height="22" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="517" y="60" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">86'</text>
</svg>
