<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="16" font-weight="bold">D. Duarte 1-1 (59')</text>
  
  <!-- Pitch (top-down, attack right for CPV) -->
  <rect x="30" y="45" width="540" height="310" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  
  <!-- Pitch markings -->
  <rect x="30" y="105" width="540" height="195" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="300" y1="45" x2="300" y2="355" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="25" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Penalty area (ARG side) -->
  <rect x="30" y="130" width="120" height="140" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="30" y="160" width="90" height="80" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Goal (ARG) -->
  <rect x="30" y="175" width="10" height="50" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- GK Martínez -->
  <circle cx="50" cy="200" r="10" fill="#e6edf3" fill-opacity="0.15" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="50" y="216" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">Martínez</text>
  
  <!-- D. Duarte position -->
  <circle cx="260" cy="230" r="12" fill="#22c55e" fill-opacity="0.4" stroke="#22c55e" stroke-width="2"/>
  <text x="260" y="230" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">D.Duarte</text>
  
  <!-- Long shot trajectory -->
  <path d="M 260 230 Q 180 210 100 195 Q 60 190 40 192" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrowRed)" stroke-dasharray="8,4"/>
  
  <!-- Shot power indicator -->
  <text x="170" y="175" fill="#f85149" font-family="Arial, sans-serif" font-size="9" font-style="italic">🔥 Long range strike</text>
  
  <!-- Defenders between -->
  <circle cx="200" cy="180" r="8" fill="#e6edf3" fill-opacity="0.1" stroke="#e6edf3" stroke-width="1"/>
  <circle cx="180" cy="220" r="8" fill="#e6edf3" fill-opacity="0.1" stroke="#e6edf3" stroke-width="1"/>
  
  <!-- Goal indicator -->
  <text x="35" y="195" fill="#f85149" font-family="Arial, sans-serif" font-size="12" font-weight="bold">⚽</text>
  
  <!-- Score banner -->
  <rect x="200" y="360" width="200" height="30" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="380" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 1-1 CPV | 59'</text>
  
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  
  <style>
    text { dominant-baseline: central; }
  </style>
</svg>