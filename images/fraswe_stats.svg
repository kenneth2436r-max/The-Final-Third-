<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <text x="300" y="30" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Match Statistics</text>

  <!-- Legend -->
  <rect x="420" y="40" width="12" height="12" fill="#22c55e"/>
  <text x="436" y="51" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">France</text>
  <rect x="500" y="40" width="12" height="12" fill="#e6edf3" opacity="0.4"/>
  <text x="516" y="51" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">Sweden</text>

  <!-- Chart area -->
  <!-- Labels -->
  <text x="50" y="90" text-anchor="end" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Possession</text>
  <text x="50" y="140" text-anchor="end" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Shots</text>
  <text x="50" y="190" text-anchor="end" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Shots on target</text>
  <text x="50" y="240" text-anchor="end" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">xG</text>
  <text x="50" y="290" text-anchor="end" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Passes</text>
  <text x="50" y="340" text-anchor="end" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">Corners</text>

  <!-- France bars -->
  <!-- Possession: 62% -->
  <rect x="60" y="75" width="310" height="20" rx="3" fill="#22c55e" opacity="0.85"/>
  <text x="375" y="90" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">62%</text>

  <!-- Shots: 25 (max) -->
  <rect x="60" y="125" width="250" height="20" rx="3" fill="#22c55e" opacity="0.85"/>
  <text x="315" y="140" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">25</text>

  <!-- Shots on target: 12 -->
  <rect x="60" y="175" width="120" height="20" rx="3" fill="#22c55e" opacity="0.85"/>
  <text x="185" y="190" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">12</text>

  <!-- xG: 3.16 (scaled) -->
  <rect x="60" y="225" width="158" height="20" rx="3" fill="#22c55e" opacity="0.85"/>
  <text x="223" y="240" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">3.16</text>

  <!-- Passes: 551 -->
  <rect x="60" y="275" width="275" height="20" rx="3" fill="#22c55e" opacity="0.85"/>
  <text x="340" y="290" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">551</text>

  <!-- Corners: 9 -->
  <rect x="60" y="325" width="90" height="20" rx="3" fill="#22c55e" opacity="0.85"/>
  <text x="155" y="340" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">9</text>

  <!-- Sweden bars -->
  <rect x="60" y="95" width="190" height="20" rx="3" fill="#e6edf3" opacity="0.4"/>
  <text x="255" y="110" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">38%</text>

  <rect x="60" y="145" width="60" height="20" rx="3" fill="#e6edf3" opacity="0.4"/>
  <text x="125" y="160" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">6</text>

  <rect x="60" y="195" width="20" height="20" rx="3" fill="#e6edf3" opacity="0.4"/>
  <text x="85" y="210" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">2</text>

  <rect x="60" y="245" width="28" height="20" rx="3" fill="#e6edf3" opacity="0.4"/>
  <text x="93" y="260" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">0.56</text>

  <rect x="60" y="295" width="170" height="20" rx="3" fill="#e6edf3" opacity="0.4"/>
  <text x="235" y="310" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">343</text>

  <rect x="60" y="345" width="10" height="20" rx="3" fill="#e6edf3" opacity="0.4"/>
  <text x="75" y="360" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">1</text>

  <!-- Number lines on bars -->
  <line x1="60" y1="70" x2="60" y2="370" stroke="#22c55e" stroke-width="1" opacity="0.2"/>
</svg>
