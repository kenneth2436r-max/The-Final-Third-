<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Pitch from above -->
  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="4" fill="#30363d"/>
  
  <!-- Goal (Senegal side - right) -->
  <rect x="535" y="165" width="25" height="70" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- Penalty area right -->
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Trossard left wing -->
  <circle cx="400" cy="140" r="14" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="134" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Trossard</text>
  <text x="400" y="144" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">cross</text>
  
  <!-- Cross/set-up arrow -->
  <path d="M 410 145 Q 460 150 500 165" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="500,165 491,162 494,172" fill="#22c55e"/>
  
  <!-- Ball -->
  <circle cx="460" cy="155" r="5" fill="#e6edf3"/>
  
  <!-- Tielemans -->
  <circle cx="500" cy="170" r="16" fill="#1a2332" stroke="#22c55e" stroke-width="2.5"/>
  <text x="500" y="164" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Tielemans</text>
  <text x="500" y="175" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">header</text>
  
  <!-- Header direction into goal -->
  <path d="M 515 175 Q 535 185 550 187" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polygon points="550,187 541,185 544,193" fill="#22c55e"/>
  
  <!-- Goal -->
  <rect x="535" y="165" width="25" height="70" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="548" y="203" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="16">G</text>
  
  <!-- Diaw keeper -->
  <circle cx="560" cy="200" r="12" fill="#1a2332" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="560" y="204" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7">Diaw</text>
  
  <!-- Score -->
  <text x="300" y="30" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BEL 2-2 SEN</text>
  <text x="300" y="385" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">89' Tielemans header from Trossard's cross</text>
  
  <!-- Timer -->
  <rect x="490" y="45" width="55" height="22" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="517" y="60" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">89'</text>
</svg>
