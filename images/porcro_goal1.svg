<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="30" y="20" width="540" height="360" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="50" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Perišić Goal — 0-1</text>
  <text x="300" y="68" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">53' — Cross from Stanišić, finish at far post</text>
  <!-- Mini pitch -->
  <rect x="80" y="80" width="440" height="260" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Pitch markings -->
  <rect x="80" y="130" width="440" height="160" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <line x1="300" y1="80" x2="300" y2="340" stroke="#30363d" stroke-width="0.5"/>
  <circle cx="300" cy="210" r="30" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Goal box left -->
  <rect x="80" y="155" width="50" height="110" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="80" y="175" width="35" height="70" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Goal box right -->
  <rect x="470" y="155" width="50" height="110" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="485" y="175" width="35" height="70" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Stanišić cross path - from right side -->
  <path d="M 490 210 Q 400 140 320 170" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="440" y="155" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="8">Stanišić cross</text>
  <!-- Perišić run -->
  <path d="M 370 250 Q 340 210 310 180" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="355" y="235" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7">Perišić run</text>
  <!-- Player dots -->
  <circle cx="320" cy="170" r="6" fill="#22c55e"/>
  <text x="320" y="162" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="6">Perišić</text>
  <circle cx="490" cy="210" r="5" fill="#e6edf3"/>
  <text x="490" y="225" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="6">Stanišić</text>
  <!-- Shot -->
  <path d="M 320 170 L 300 175" stroke="#f85149" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="168" fill="#f85149" font-family="Arial,sans-serif" font-size="7">Shot</text>
  <!-- Goal indicator -->
  <rect x="250" y="85" width="100" height="22" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="300" y="100" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">⚽ GOAL</text>
  <!-- Timer -->
  <circle cx="540" cy="40" r="16" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="540" y="45" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="10" font-weight="bold">53'</text>
  <!-- Scoreboard -->
  <rect x="240" y="355" width="120" height="28" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="270" y="374" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">POR</text>
  <text x="300" y="374" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">0 - 1</text>
  <text x="340" y="374" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">CRO</text>
</svg>