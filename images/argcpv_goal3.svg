<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>

  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#fff" stroke-width="1.5" rx="4" opacity="0.45"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-width="1" opacity="0.45"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="4" fill="#fff" opacity="0.35"/>
  <rect x="40" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="40" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="510" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <rect x="557" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- Event location: Messi corner from right -->
  <circle cx="520" cy="180" r="6" fill="#66aaff" opacity="0.8"/>
  <circle cx="520" cy="180" r="14" fill="none" stroke="#66aaff" stroke-width="1.5" opacity="0.5"/>

  <!-- Messi corner taker -->
  <circle cx="530" cy="170" r="14" fill="#0d1117" stroke="#66aaff" stroke-width="2"/>
  <text x="530" y="166" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7" font-weight="bold">Messi</text>
  <text x="530" y="175" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">corner</text>

  <!-- Inswinging corner -->
  <path d="M 520 175 Q 480 120 460 150" fill="none" stroke="#66aaff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="460,150 465,157 456,156" fill="#66aaff"/>

  <!-- Crowded melee in 6-yard box -->
  <rect x="440" y="160" width="30" height="30" fill="#ff6b6b" opacity="0.08"/>
  <circle cx="455" cy="175" r="8" fill="none" stroke="#66aaff" stroke-width="1" opacity="0.5"/>
  <text x="455" y="172" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="6">melee</text>

  <!-- Mac Allister flicks down -->
  <circle cx="465" cy="160" r="12" fill="#0d1117" stroke="#66aaff" stroke-width="1.5"/>
  <text x="465" y="157" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="6" font-weight="bold">Mac A.</text>
  <text x="465" y="165" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="6">flick</text>

  <!-- Ball bounces -->
  <circle cx="460" cy="175" r="4" fill="#fff"/>

  <!-- L. Martínez half-volley -->
  <circle cx="460" cy="185" r="15" fill="#0d1117" stroke="#66aaff" stroke-width="2.5"/>
  <text x="460" y="181" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">L. Martínez</text>
  <text x="460" y="191" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">half-volley</text>

  <!-- Shot over Vozinha at near post -->
  <path d="M 460 195 Q 445 190 440 185" fill="none" stroke="#66aaff" stroke-width="2"/>
  <polygon points="440,185 445,192 436,191" fill="#66aaff"/>

  <!-- Goal -->
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="39" y="205" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">G</text>

  <rect x="230" y="8" width="140" height="24" rx="12" fill="#000" opacity="0.6"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 2-1 CPV</text>

  <rect x="100" y="360" width="400" height="30" rx="6" fill="#000" opacity="0.6"/>
  <text x="300" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">92' L. Martínez lashes half-volley from crowded corner melee</text>

  <rect x="475" y="45" width="70" height="22" rx="11" fill="#000" opacity="0.6"/>
  <text x="510" y="60" text-anchor="middle" fill="#66aaff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">92' ET</text>
</svg>
