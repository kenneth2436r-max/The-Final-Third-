<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
  <!-- Full pitch top-down -->
  <rect x="50" y="60" width="500" height="280" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.2"/>
  <line x1="300" y1="60" x2="300" y2="340" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="200" r="35" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <rect x="50" y="105" width="100" height="190" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <rect x="450" y="105" width="100" height="190" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <rect x="50" y="140" width="55" height="120" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.1"/>
  <rect x="495" y="140" width="55" height="120" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.1"/>
  <!-- Goal (attacking right) -->
  <rect x="540" y="175" width="10" height="50" fill="none" stroke="#e6edf3" stroke-width="1.5"/>
  <!-- Gordon starting position (left wing) -->
  <circle cx="160" cy="270" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="160" y="286" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="8">Gordon</text>
  <!-- Cross trajectory -->
  <path d="M 160,270 Q 300,260 510,180" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- Kane position -->
  <circle cx="510" cy="178" r="7" fill="#22c55e" opacity="0.9"/>
  <text x="510" y="166" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="8" font-weight="bold">Kane</text>
  <!-- Header trajectory into goal -->
  <line x1="510" y1="178" x2="545" y2="185" stroke="#ff6b35" stroke-width="2.5" marker-end="url(#arrowShot)"/>
  <!-- Ball -->
  <circle cx="545" cy="185" r="5" fill="#fff" stroke="#ff6b35" stroke-width="1.5"/>
  <!-- COD defenders -->
  <text x="480" y="140" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="7">COD DEF</text>
  <!-- Mpasi -->
  <text x="530" y="200" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="7">Mpasi</text>
  <!-- Score -->
  <rect x="200" y="65" width="200" height="28" rx="4" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="84" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="14" font-weight="bold">ENG 1-1 COD  |  75'</text>
  <rect x="410" y="65" width="60" height="28" rx="4" fill="#ff6b35" opacity="0.2" stroke="#ff6b35" stroke-width="1"/>
  <text x="440" y="84" text-anchor="middle" fill="#ff6b35" font-family="Arial,sans-serif" font-size="12" font-weight="bold">75'</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#22c55e"/>
    </marker>
    <marker id="arrowShot" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ff6b35"/>
    </marker>
  </defs>
  <!-- Description -->
  <text x="300" y="370" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="10">Gordon whipped in a left-footed cross from the left; Kane rose highest to plant a header past Mpasi.</text>
</svg>