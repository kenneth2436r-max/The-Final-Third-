<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <marker id="arrowPass" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ffffff"/>
    </marker>
    <marker id="arrowShot" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#ff6b35"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- Full pitch markings -->
  <rect x="50" y="60" width="500" height="280" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <line x1="300" y1="60" x2="300" y2="340" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="300" cy="200" r="35" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="50" y="105" width="100" height="190" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="450" y="105" width="100" height="190" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="50" y="140" width="55" height="120" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  <rect x="495" y="140" width="55" height="120" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  <!-- Goals -->
  <rect x="50" y="175" width="8" height="50" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="542" y="175" width="8" height="50" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Bellingham position (midfield) -->
  <circle cx="340" cy="200" r="6" fill="#f0f0f0" stroke="#0022aa" stroke-width="1.5"/>
  <text x="340" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="9" font-weight="bold">Bellingham</text>
  <text x="340" y="230" text-anchor="middle" fill="#f0f0f0" opacity="0.7" font-family="Arial,sans-serif" font-size="7">CAM</text>
  <!-- Through ball -->
  <path d="M 340,200 Q 400,195 480,200" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPass)"/>
  <!-- Label -->
  <text x="410" y="190" text-anchor="middle" fill="#ffffff" opacity="0.6" font-family="Arial,sans-serif" font-size="7">Through ball</text>
  <!-- Kane event marker (green circle + ring) at center of box -->
  <circle cx="490" cy="200" r="10" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="490" cy="200" r="5" fill="#22c55e"/>
  <text x="490" y="218" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="9" font-weight="bold">Kane</text>
  <text x="490" y="228" text-anchor="middle" fill="#f0f0f0" opacity="0.7" font-family="Arial,sans-serif" font-size="7">ST</text>
  <!-- Volley trajectory into goal -->
  <line x1="490" y1="200" x2="546" y2="198" stroke="#ff6b35" stroke-width="2.5" marker-end="url(#arrowShot)"/>
  <!-- Ball in goal -->
  <circle cx="546" cy="198" r="5" fill="#ffffff" stroke="#ff6b35" stroke-width="1.5"/>
  <!-- Mpasi -->
  <circle cx="535" cy="210" r="10" fill="#0033aa" stroke="#ffcc00" stroke-width="1"/>
  <text x="535" y="213" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="7">Mpasi</text>
  <!-- COD defenders -->
  <text x="460" y="155" text-anchor="middle" fill="#ffffff" opacity="0.5" font-family="Arial,sans-serif" font-size="7">COD DEF</text>
  <!-- Score banner -->
  <rect x="200" y="65" width="200" height="28" rx="4" fill="#000" opacity="0.5" stroke="#ffffff" stroke-width="0.5"/>
  <text x="300" y="84" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">ENG 1-1 COD  |  58'</text>
  <!-- Timer -->
  <rect x="410" y="65" width="60" height="28" rx="4" fill="#ff6b35" opacity="0.3" stroke="#ff6b35" stroke-width="1"/>
  <text x="440" y="84" text-anchor="middle" fill="#ff6b35" font-family="Arial,sans-serif" font-size="12" font-weight="bold">58'</text>
  <!-- Description -->
  <text x="300" y="370" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10" opacity="0.8">Bellingham slipped a through ball to Kane, who volleyed first-time past Mpasi from the center of the box.</text>
</svg>