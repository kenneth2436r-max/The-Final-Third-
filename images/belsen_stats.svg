<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <text x="300" y="30" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Match Statistics</text>
  
  <!-- Legend -->
  <rect x="160" y="45" width="14" height="14" rx="2" fill="#22c55e"/>
  <text x="178" y="57" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11">Belgium</text>
  <rect x="310" y="45" width="14" height="14" rx="2" fill="#f97316"/>
  <text x="328" y="57" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11">Senegal</text>
  
  <!-- Chart area -->
  <!-- Labels -->
  <text x="55" y="95" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">Possession</text>
  <text x="55" y="145" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">Shots</text>
  <text x="55" y="195" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">Shots on Target</text>
  <text x="55" y="245" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">xG</text>
  <text x="55" y="295" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">Corners</text>
  <text x="55" y="345" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">Fouls</text>
  
  <!-- Max bar width = 220 -->
  
  <!-- Possession: BEL 52%, SEN 48% -->
  <rect x="70" y="82" width="208" height="20" rx="3" fill="#22c55e" opacity="0.9"/>
  <text x="280" y="97" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">52%</text>
  <rect x="310" y="82" width="192" height="20" rx="3" fill="#f97316" opacity="0.9"/>
  <text x="500" y="97" fill="#f97316" font-family="Arial, sans-serif" font-size="11" font-weight="bold">48%</text>
  
  <!-- Shots: BEL 19, SEN 19 - equal -->
  <rect x="70" y="132" width="208" height="20" rx="3" fill="#22c55e" opacity="0.9"/>
  <text x="280" y="147" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">19</text>
  <rect x="310" y="132" width="208" height="20" rx="3" fill="#f97316" opacity="0.9"/>
  <text x="520" y="147" fill="#f97316" font-family="Arial, sans-serif" font-size="11" font-weight="bold">19</text>
  
  <!-- Shots on target: BEL 5, SEN 5 - equal -->
  <rect x="70" y="182" width="110" height="20" rx="3" fill="#22c55e" opacity="0.9"/>
  <text x="182" y="197" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">5</text>
  <rect x="310" y="182" width="110" height="20" rx="3" fill="#f97316" opacity="0.9"/>
  <text x="422" y="197" fill="#f97316" font-family="Arial, sans-serif" font-size="11" font-weight="bold">5</text>
  
  <!-- xG: BEL 1.85, SEN 3.38 -->
  <rect x="70" y="232" width="132" height="20" rx="3" fill="#22c55e" opacity="0.9"/>
  <text x="204" y="247" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">1.85</text>
  <rect x="310" y="232" width="220" height="20" rx="3" fill="#f97316" opacity="0.9"/>
  <text x="532" y="247" fill="#f97316" font-family="Arial, sans-serif" font-size="11" font-weight="bold">3.38</text>
  
  <!-- Corners: BEL 4, SEN 2 -->
  <rect x="70" y="282" width="88" height="20" rx="3" fill="#22c55e" opacity="0.9"/>
  <text x="160" y="297" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">4</text>
  <rect x="310" y="282" width="44" height="20" rx="3" fill="#f97316" opacity="0.9"/>
  <text x="356" y="297" fill="#f97316" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2</text>
  
  <!-- Fouls: BEL 22, SEN 12 -->
  <rect x="70" y="332" width="220" height="20" rx="3" fill="#22c55e" opacity="0.9"/>
  <text x="292" y="347" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">22</text>
  <rect x="310" y="332" width="132" height="20" rx="3" fill="#f97316" opacity="0.9"/>
  <text x="444" y="347" fill="#f97316" font-family="Arial, sans-serif" font-size="11" font-weight="bold">12</text>
</svg>
