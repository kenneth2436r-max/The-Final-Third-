<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Kylian Mbappé — Activity Heatmap</text>

  <!-- Pitch -->
  <rect x="50" y="45" width="500" height="310" fill="none" stroke="#22c55e" stroke-width="1.5" rx="3"/>
  <line x1="50" y1="200" x2="550" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="200" r="30" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.2"/>
  <rect x="250" y="45" width="100" height="155" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.2"/>
  <rect x="250" y="200" width="100" height="155" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.2"/>
  <rect x="520" y="110" width="30" height="180" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>

  <!-- Heatmap regions (left wing bias, central attacking) -->
  <!-- Left wing hottest -->
  <ellipse cx="120" cy="170" rx="60" ry="80" fill="#22c55e" opacity="0.45"/>
  <ellipse cx="120" cy="170" rx="40" ry="55" fill="#22c55e" opacity="0.5"/>
  <ellipse cx="120" cy="170" rx="20" ry="30" fill="#22c55e" opacity="0.7"/>

  <!-- Central attacking zone -->
  <ellipse cx="300" cy="150" rx="70" ry="50" fill="#22c55e" opacity="0.25"/>
  <ellipse cx="300" cy="140" rx="35" ry="25" fill="#22c55e" opacity="0.4"/>

  <!-- Box entries -->
  <ellipse cx="460" cy="160" rx="40" ry="50" fill="#22c55e" opacity="0.2"/>

  <!-- Left half space -->
  <ellipse cx="180" cy="250" rx="50" ry="40" fill="#22c55e" opacity="0.15"/>

  <!-- Key areas highlight -->
  <!-- Box highlight -->
  <rect x="520" y="140" width="30" height="120" fill="#22c55e" opacity="0.08" stroke="#22c55e" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Hotspot markers -->
  <circle cx="120" cy="165" r="4" fill="#22c55e" opacity="0.9"/>
  <circle cx="100" cy="190" r="3" fill="#22c55e" opacity="0.8"/>
  <circle cx="140" cy="150" r="3" fill="#22c55e" opacity="0.8"/>
  <circle cx="300" cy="135" r="3" fill="#22c55e" opacity="0.7"/>
  <circle cx="460" cy="150" r="2" fill="#22c55e" opacity="0.6"/>
  <circle cx="130" cy="130" r="2.5" fill="#22c55e" opacity="0.7"/>
  <circle cx="110" cy="200" r="2" fill="#22c55e" opacity="0.6"/>

  <!-- Density labels -->
  <text x="120" y="260" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7" opacity="0.5">HIGH</text>
  <text x="300" y="200" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7" opacity="0.5">CENTRAL</text>
  <text x="505" y="205" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7" opacity="0.5" transform="rotate(-90,505,205)">BOX</text>

  <!-- Stats bar -->
  <rect x="100" y="365" width="400" height="28" rx="4" fill="#1a3c2a" stroke="#22c55e" stroke-width="0.5"/>
  <text x="170" y="383" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">2 Goals</text>
  <line x1="245" y1="366" x2="245" y2="392" stroke="#22c55e" stroke-width="0.5" opacity="0.5"/>
  <text x="335" y="383" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">18 WC Career Goals</text>
  <line x1="420" y1="366" x2="420" y2="392" stroke="#22c55e" stroke-width="0.5" opacity="0.5"/>
  <text x="485" y="383" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11">3 SOT</text>
</svg>
