<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Own Goal 3-2 (111')</text>
  
  <!-- Pitch -->
  <rect x="30" y="45" width="540" height="310" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  
  <!-- Pitch markings -->
  <rect x="30" y="105" width="540" height="195" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6,4"/>
  
  <!-- Penalty area (CPV side) -->
  <rect x="450" y="130" width="120" height="140" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="480" y="160" width="90" height="80" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Goal (CPV) -->
  <rect x="560" y="175" width="10" height="50" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- Cross delivery -->
  <path d="M 350 130 Q 420 120 480 170 Q 510 190 530 185" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  
  <!-- Crosser -->
  <circle cx="350" cy="130" r="10" fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350" y="115" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">Cross</text>
  
  <!-- Borges own goal - deflection -->
  <circle cx="535" cy="185" r="12" fill="#f85149" fill-opacity="0.35" stroke="#f85149" stroke-width="2"/>
  <text x="535" y="185" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Borges</text>
  
  <!-- Deflection into net -->
  <path d="M 535 185 L 565 190" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  
  <!-- Pressure indicator -->
  <path d="M 510 175 Q 520 170 530 175" fill="none" stroke="#e6edf3" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="520" y="165" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7">⬇ pressure</text>
  
  <!-- Defenders -->
  <circle cx="500" cy="195" r="7" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <circle cx="520" cy="200" r="7" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  
  <!-- OG label -->
  <rect x="525" y="205" width="35" height="16" rx="3" fill="#f85149" fill-opacity="0.3" stroke="#f85149" stroke-width="1"/>
  <text x="542" y="217" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="8" font-weight="bold">OG</text>
  
  <!-- Goal indicator -->
  <text x="562" y="192" fill="#f85149" font-family="Arial, sans-serif" font-size="12" font-weight="bold">⚽</text>
  
  <!-- Extra time label -->
  <rect x="230" y="100" width="140" height="20" rx="4" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="300" y="114" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔄 AET</text>
  
  <!-- Score banner -->
  <rect x="200" y="360" width="200" height="30" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="380" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 3-2 CPV | 111' (AET)</text>
  
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  
  <style>
    text { dominant-baseline: central; }
  </style>
</svg>