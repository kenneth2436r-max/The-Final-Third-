<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>

  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#fff" stroke-width="1.5" rx="4" opacity="0.45"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-width="1" opacity="0.45"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="4" fill="#fff" opacity="0.35"/>
  <rect x="40" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="40" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="510" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <rect x="557" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- Event location: Messi corner from right -->
  <circle cx="520" cy="180" r="6" fill="#66aaff" opacity="0.8"/>
  <circle cx="520" cy="180" r="14" fill="none" stroke="#66aaff" stroke-width="1.5" opacity="0.5"/>

  <!-- Messi corner taker -->
  <circle cx="530" cy="170" r="14" fill="#0d1117" stroke="#66aaff" stroke-width="2"/>
  <text x="530" y="166" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7" font-weight="bold">Messi</text>
  <text x="530" y="175" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">corner</text>

  <!-- Whip to near post -->
  <path d="M 520 175 Q 480 120 460 155" fill="none" stroke="#66aaff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="460,155 465,162 456,161" fill="#66aaff"/>
  <circle cx="465" cy="155" r="5" fill="#fff"/>

  <!-- Romero leaps for header -->
  <circle cx="460" cy="165" r="16" fill="#0d1117" stroke="#66aaff" stroke-width="2.5"/>
  <text x="460" y="161" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Romero</text>
  <text x="460" y="171" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">powerful header</text>

  <!-- Header path -->
  <path d="M 455 160 Q 440 155 435 165" fill="none" stroke="#66aaff" stroke-width="2"/>
  <polygon points="435,165 442,169 439,160" fill="#66aaff"/>

  <!-- Borges deflection point -->
  <circle cx="435" cy="170" r="14" fill="#0d1117" stroke="#22c55e" stroke-width="2"/>
  <text x="435" y="166" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7" font-weight="bold">Borges</text>
  <text x="435" y="176" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="7">DEFLECTION</text>

  <!-- Wicked deflection trajectory change -->
  <path d="M 435 175 Q 420 195 415 200" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="415,200 422,204 420,195" fill="#ff6b6b"/>

  <!-- Ball rolls into goal -->
  <path d="M 415 200 Q 400 205 80 205" fill="none" stroke="#66aaff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="80,205 88,209 88,201" fill="#66aaff"/>

  <!-- Vozinha stranded -->
  <circle cx="540" cy="200" r="12" fill="#0d1117" stroke="#22c55e" stroke-width="1.5"/>
  <text x="540" y="197" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="6">Vozinha</text>
  <text x="540" y="206" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="6">stranded</text>

  <!-- Goal -->
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="39" y="205" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">OG</text>

  <rect x="230" y="8" width="140" height="24" rx="12" fill="#000" opacity="0.6"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 3-2 CPV</text>

  <rect x="80" y="360" width="440" height="30" rx="6" fill="#000" opacity="0.6"/>
  <text x="300" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">111' Romero header deflected off Borges — cruel own goal winner</text>

  <rect x="475" y="45" width="70" height="22" rx="11" fill="#000" opacity="0.6"/>
  <text x="510" y="60" text-anchor="middle" fill="#66aaff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">111' ET</text>
</svg>
