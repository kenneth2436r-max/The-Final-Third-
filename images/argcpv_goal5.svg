<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <marker id="arrowShot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff0000"/>
    </marker>
    <marker id="arrowCross" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- PITCH MARKINGS -->
  <rect x="25" y="40" width="550" height="320" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2" rx="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="28" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="2" fill="#fff" fill-opacity="0.4"/>
  <rect x="440" y="127" width="135" height="146" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="475" y="160" width="100" height="80" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="575" y="175" width="8" height="50" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="25" y="127" width="135" height="146" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="25" y="160" width="100" height="80" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="17" y="175" width="8" height="50" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Score banner -->
  <rect x="195" y="8" width="210" height="28" rx="14" fill="#000" fill-opacity="0.65"/>
  <text x="300" y="26" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 3-2 CPV</text>

  <!-- Timer badge -->
  <rect x="515" y="8" width="60" height="24" rx="12" fill="#000" fill-opacity="0.55"/>
  <text x="545" y="24" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">88'</text>

  <!-- G indicator on CPV goal (own goal) -->
  <text x="562" y="185" fill="#ff0000" font-family="Arial, sans-serif" font-size="18" font-weight="bold">G</text>

  <!-- Event marker - Borges deflection position -->
  <circle cx="490" cy="165" r="10" fill="#22c55e" fill-opacity="0.6"/>
  <circle cx="490" cy="165" r="16" fill="none" stroke="#22c55e" stroke-width="2"/>

  <!-- Borges (own goal) -->
  <circle cx="490" cy="165" r="12" fill="#006600" fill-opacity="0.85" stroke="#ff0000" stroke-width="2"/>
  <text x="490" y="165" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7" font-weight="bold">Borges</text>

  <!-- Messi (crosser) -->
  <circle cx="420" cy="255" r="12" fill="#66aaff" fill-opacity="0.8" stroke="#fff" stroke-width="1.5"/>
  <text x="420" y="255" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Messi</text>

  <!-- Cross delivery -->
  <path d="M 420 255 Q 430 210 460 180 Q 475 170 490 165" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowCross)"/>

  <!-- Deflection trajectory into goal -->
  <path d="M 490 165 Q 530 175 568 190" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#arrowShot)"/>

  <!-- OG label -->
  <rect x="482" y="178" width="30" height="16" rx="3" fill="#ff0000" fill-opacity="0.7"/>
  <text x="497" y="190" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="bold">OG</text>

  <!-- GK Vozinha -->
  <circle cx="565" cy="200" r="10" fill="#f5c842" stroke="#d4a830" stroke-width="1.5"/>
  <text x="565" y="216" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7" style="text-shadow:1px 1px 2px #000;">Vozinha</text>

  <!-- CPV defenders -->
  <circle cx="500" cy="195" r="7" fill="#006600" stroke="#004d00" stroke-width="1"/>
  <circle cx="520" cy="200" r="7" fill="#006600" stroke="#004d00" stroke-width="1"/>

  <!-- L. Martínez waiting for cross -->
  <circle cx="485" cy="195" r="8" fill="#66aaff" fill-opacity="0.6" stroke="#fff" stroke-width="1"/>
  <text x="485" y="208" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="6" style="text-shadow:1px 1px 2px #000;">L.Martínez</text>

  <!-- Description bar -->
  <rect x="140" y="360" width="320" height="28" rx="14" fill="#000" fill-opacity="0.6"/>
  <text x="300" y="378" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11">Borges' deflection sends Messi cross into own net</text>

  <style>
    text { dominant-baseline: central; }
  </style>
</svg>