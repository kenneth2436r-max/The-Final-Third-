<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Lionel Messi — Activity Heatmap</text>
  
  <!-- Pitch -->
  <rect x="40" y="45" width="520" height="310" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  
  <!-- Pitch markings -->
  <rect x="40" y="122" width="520" height="155" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="300" y1="45" x2="300" y2="355" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="22" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Penalty areas -->
  <rect x="40" y="137" width="100" height="125" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="460" y="137" width="100" height="125" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Goals -->
  <rect x="40" y="177" width="8" height="45" fill="none" stroke="#e6edf3" stroke-width="2"/>
  <rect x="552" y="177" width="8" height="45" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- Heatmap density zones (right-wing and central attacking areas, dropping into midfield) -->
  
  <!-- Primary zone: Right wing attacking third -->
  <ellipse cx="440" cy="170" rx="60" ry="55" fill="#22c55e" fill-opacity="0.5"/>
  <ellipse cx="430" cy="185" rx="35" ry="30" fill="#22c55e" fill-opacity="0.7"/>
  <circle cx="445" cy="175" r="18" fill="#22c55e" fill-opacity="0.9"/>
  
  <!-- Central attacking zone -->
  <ellipse cx="350" cy="195" rx="45" ry="40" fill="#22c55e" fill-opacity="0.35"/>
  <ellipse cx="360" cy="200" rx="22" ry="18" fill="#22c55e" fill-opacity="0.55"/>
  
  <!-- Dropping into midfield (free role) -->
  <ellipse cx="280" cy="220" rx="50" ry="35" fill="#22c55e" fill-opacity="0.25"/>
  <ellipse cx="250" cy="240" rx="40" ry="25" fill="#22c55e" fill-opacity="0.15"/>
  
  <!-- Right flank activity -->
  <ellipse cx="400" cy="250" rx="35" ry="20" fill="#22c55e" fill-opacity="0.2"/>
  <ellipse cx="430" cy="260" rx="25" ry="15" fill="#22c55e" fill-opacity="0.12"/>
  
  <!-- Movement arrows -->
  <path d="M 300 220 Q 380 190 440 170" fill="none" stroke="#e6edf3" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowMov)"/>
  <path d="M 440 170 Q 350 185 300 220" fill="none" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M 300 220 Q 350 250 400 250" fill="none" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  
  <!-- Legend / Stats card -->
  <rect x="390" y="355" width="180" height="38" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="368" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">⚽ 1 goal</text>
  <text x="400" y="380" fill="#8b949e" font-family="Arial, sans-serif" font-size="8">20 career WC goals</text>
  <text x="510" y="368" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8">120 min</text>
  <text x="510" y="380" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8">Captain ★</text>
  
  <!-- Heatmap legend -->
  <rect x="40" y="358" width="12" height="12" rx="2" fill="#22c55e" fill-opacity="0.9"/>
  <rect x="56" y="358" width="12" height="12" rx="2" fill="#22c55e" fill-opacity="0.6"/>
  <rect x="72" y="358" width="12" height="12" rx="2" fill="#22c55e" fill-opacity="0.3"/>
  <text x="90" y="366" fill="#8b949e" font-family="Arial, sans-serif" font-size="8">High → Low activity</text>
  
  <defs>
    <marker id="arrowMov" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/>
    </marker>
  </defs>
  
  <style>
    text { dominant-baseline: central; }
  </style>
</svg>