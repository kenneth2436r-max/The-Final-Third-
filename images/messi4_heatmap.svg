<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <marker id="arrowMov" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fcd34d"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- PITCH MARKINGS -->
  <rect x="40" y="45" width="520" height="310" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2" rx="4"/>
  <rect x="40" y="122" width="520" height="155" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="7,5"/>
  <line x1="300" y1="45" x2="300" y2="355" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="22" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="2" fill="#fff" fill-opacity="0.4"/>
  <!-- Penalty areas -->
  <rect x="40" y="137" width="100" height="125" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="460" y="137" width="100" height="125" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- Goal areas -->
  <rect x="40" y="167" width="68" height="66" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="492" y="167" width="68" height="66" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Goals -->
  <rect x="32" y="177" width="8" height="45" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="560" y="177" width="8" height="45" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Lionel Messi — Activity Heatmap</text>

  <!-- Heatmap density zones (warm colors for visibility on green pitch) -->

  <!-- Primary zone: Right wing attacking third -->
  <ellipse cx="440" cy="170" rx="60" ry="55" fill="#f59e0b" fill-opacity="0.45"/>
  <ellipse cx="430" cy="185" rx="35" ry="30" fill="#ef4444" fill-opacity="0.5"/>
  <circle cx="445" cy="175" r="18" fill="#ef4444" fill-opacity="0.8"/>

  <!-- Central attacking zone -->
  <ellipse cx="350" cy="195" rx="45" ry="40" fill="#f59e0b" fill-opacity="0.3"/>
  <ellipse cx="360" cy="200" rx="22" ry="18" fill="#f97316" fill-opacity="0.5"/>

  <!-- Dropping into midfield (free role) -->
  <ellipse cx="280" cy="220" rx="50" ry="35" fill="#fbbf24" fill-opacity="0.2"/>
  <ellipse cx="250" cy="240" rx="40" ry="25" fill="#fbbf24" fill-opacity="0.12"/>

  <!-- Right flank activity -->
  <ellipse cx="400" cy="250" rx="35" ry="20" fill="#f59e0b" fill-opacity="0.15"/>
  <ellipse cx="430" cy="260" rx="25" ry="15" fill="#f59e0b" fill-opacity="0.1"/>

  <!-- Movement arrows -->
  <path d="M 300 220 Q 380 190 440 170" fill="none" stroke="#fcd34d" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowMov)"/>
  <path d="M 440 170 Q 350 185 300 220" fill="none" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M 300 220 Q 350 250 400 250" fill="none" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Legend / Stats card -->
  <rect x="390" y="355" width="180" height="38" rx="4" fill="#000" fill-opacity="0.5" stroke="#fff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="400" y="368" fill="#f59e0b" font-family="Arial, sans-serif" font-size="9" font-weight="bold">GK 1 goal / 2 assists</text>
  <text x="400" y="380" fill="#fff" fill-opacity="0.6" font-family="Arial, sans-serif" font-size="8">21 career WC goals</text>
  <text x="530" y="368" fill="#fff" fill-opacity="0.6" font-family="Arial, sans-serif" font-size="8">120 min</text>
  <text x="530" y="380" fill="#fff" fill-opacity="0.6" font-family="Arial, sans-serif" font-size="8">Captain ★</text>

  <!-- Heatmap legend -->
  <rect x="40" y="360" width="12" height="12" rx="2" fill="#ef4444" fill-opacity="0.8"/>
  <rect x="56" y="360" width="12" height="12" rx="2" fill="#f59e0b" fill-opacity="0.5"/>
  <rect x="72" y="360" width="12" height="12" rx="2" fill="#fbbf24" fill-opacity="0.2"/>
  <text x="90" y="368" fill="#fff" fill-opacity="0.6" font-family="Arial, sans-serif" font-size="8">High → Low activity</text>

  <style>
    text { dominant-baseline: central; }
  </style>
</svg>