<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Pitch from above -->
  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="4" fill="#30363d"/>
  
  <!-- Goal -->
  <rect x="40" y="165" width="25" height="70" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- Penalty area -->
  <rect x="40" y="140" width="100" height="120" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Niakhaté defence -->
  <circle cx="350" cy="260" r="14" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="254" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Niakhaté</text>
  <text x="350" y="264" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">long ball</text>
  
  <!-- Long ball arrow -->
  <path d="M 360 255 Q 300 150 200 160" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="200,160 209,157 205,168" fill="#22c55e"/>
  
  <!-- Ball -->
  <circle cx="280" cy="195" r="5" fill="#e6edf3"/>
  
  <!-- Sarr -->
  <circle cx="150" cy="155" r="16" fill="#1a2332" stroke="#22c55e" stroke-width="2.5"/>
  <text x="150" y="149" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Sarr</text>
  <text x="150" y="160" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">chest &amp; run</text>
  
  <!-- Sarr run arrow -->
  <path d="M 200 165 Q 170 170 155 170" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polygon points="155,170 165,173 163,166" fill="#22c55e"/>
  
  <!-- Sarr finish into goal -->
  <path d="M 140 165 Q 100 180 70 185" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polygon points="70,185 79,187 77,181" fill="#22c55e"/>
  
  <!-- Goal -->
  <rect x="40" y="165" width="25" height="70" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="52" y="203" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="16">G</text>
  
  <!-- Courtois -->
  <circle cx="65" cy="200" r="12" fill="#1a2332" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="65" y="204" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7">Courtois</text>
  
  <!-- Score -->
  <text x="300" y="30" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BEL 0-2 SEN</text>
  <text x="300" y="385" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="12">51' Sarr chests down Niakhaté's long ball and finishes</text>
  
  <!-- Timer -->
  <rect x="490" y="45" width="55" height="22" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="517" y="60" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">51'</text>
</svg>
