<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>

  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#fff" stroke-width="1.5" rx="4" opacity="0.45"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-width="1" opacity="0.45"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="4" fill="#fff" opacity="0.35"/>
  <rect x="40" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="40" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="510" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <rect x="557" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- Event location - right flank attack -->
  <circle cx="440" cy="220" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="440" cy="220" r="12" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>

  <!-- Doku on right wing -->
  <circle cx="440" cy="220" r="16" fill="#0d1117" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="215" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Doku</text>
  <text x="440" y="225" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">run</text>

  <path d="M 450 220 Q 460 180 440 150" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="440,150 435,158 445,157" fill="#22c55e"/>
  <circle cx="440" cy="150" r="5" fill="#fff"/>

  <!-- Trossard finish position -->
  <circle cx="430" cy="130" r="16" fill="#0d1117" stroke="#22c55e" stroke-width="2"/>
  <text x="430" y="125" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Trossard</text>
  <text x="430" y="135" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">cut in</text>

  <path d="M 430 145 Q 410 150 400 145" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="400,145 408,149 408,141" fill="#22c55e"/>

  <!-- Shot into goal (right side) -->
  <path d="M 400 145 Q 380 140 565 195" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="565,195 557,190 558,200" fill="#22c55e"/>

  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="39" y="205" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">G</text>

  <rect x="230" y="8" width="140" height="24" rx="12" fill="#000" opacity="0.6"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">BEL 1-1 SEN</text>

  <rect x="120" y="360" width="360" height="30" rx="6" fill="#000" opacity="0.6"/>
  <text x="300" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="11">55' Trossard cuts inside from the right and curls it in</text>

  <rect x="490" y="45" width="55" height="22" rx="11" fill="#000" opacity="0.6"/>
  <text x="517" y="60" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">55'</text>
</svg>
