<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- Pitch half (defending left) -->
  <rect x="40" y="40" width="260" height="320" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="300" cy="200" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="40" y="90" width="120" height="220" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="40" y="130" width="73" height="140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="16" font-weight="bold">DR Congo 4-3-3</text>
  <!-- GK - Mpasi -->
  <circle cx="110" cy="200" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="110" y="196" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Mpasi</text>
  <text x="110" y="206" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">GK</text>
  <!-- DEF - Wan-Bissaka -->
  <circle cx="170" cy="120" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="170" y="116" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Wan-B.</text>
  <text x="170" y="126" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">RB</text>
  <!-- DEF - Mbemba (c) -->
  <circle cx="145" cy="160" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="145" y="156" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Mbemba</text>
  <text x="145" y="166" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">CB</text>
  <!-- DEF - Tuanzebe -->
  <circle cx="145" cy="240" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="145" y="236" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Tuanzebe</text>
  <text x="145" y="246" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">CB</text>
  <!-- DEF - Masuaku -->
  <circle cx="170" cy="280" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="170" y="276" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Masuaku</text>
  <text x="170" y="286" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">LB</text>
  <!-- MID - Mukau -->
  <circle cx="215" cy="155" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="215" y="151" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Mukau</text>
  <text x="215" y="161" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">CM</text>
  <!-- MID - Moutoussamy -->
  <circle cx="215" cy="200" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="215" y="196" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Moutous.</text>
  <text x="215" y="206" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">CM</text>
  <!-- MID - Sadiki -->
  <circle cx="215" cy="245" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="215" y="241" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Sadiki</text>
  <text x="215" y="251" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">CM</text>
  <!-- FWD - Mbuku -->
  <circle cx="260" cy="130" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="260" y="126" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Mbuku</text>
  <text x="260" y="136" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">RW</text>
  <!-- FWD - Wissa -->
  <circle cx="265" cy="200" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="265" y="196" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Wissa</text>
  <text x="265" y="206" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">ST</text>
  <!-- FWD - Cipenga -->
  <circle cx="260" cy="270" r="14" fill="#0033aa" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="260" y="266" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="8">Cipenga</text>
  <text x="260" y="276" text-anchor="middle" fill="#ffcc00" font-family="Arial,sans-serif" font-size="7">LW</text>
  <!-- Legend -->
  <text x="40" y="370" fill="#ffffff" opacity="0.6" font-family="Arial,sans-serif" font-size="9">4-3-3 — Three-man midfield — Captain: Mbemba</text>
</svg>