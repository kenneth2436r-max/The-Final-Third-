<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Lopes Cabral 2-2 (103')</text>
  
  <!-- Pitch -->
  <rect x="30" y="45" width="540" height="310" fill="#161b22" stroke="#30363d" stroke-width="2" rx="4"/>
  
  <!-- Pitch markings -->
  <rect x="30" y="105" width="540" height="195" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6,4"/>
  
  <!-- Penalty area (ARG side) -->
  <rect x="30" y="130" width="120" height="140" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="30" y="160" width="90" height="80" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Goal (ARG) -->
  <rect x="30" y="175" width="10" height="50" fill="none" stroke="#e6edf3" stroke-width="2"/>
  
  <!-- Free kick position -->
  <circle cx="80" cy="165" r="4" fill="#f85149"/>
  <text x="80" y="148" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="8" font-weight="bold">FK</text>
  
  <!-- Free kick trajectory -->
  <path d="M 80 165 Q 60 130 80 110 Q 100 95 110 120 Q 120 145 90 170" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  
  <!-- Lopes Cabral position -->
  <circle cx="65" cy="185" r="12" fill="#22c55e" fill-opacity="0.4" stroke="#22c55e" stroke-width="2"/>
  <text x="65" y="185" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="8" font-weight="bold">L.Cabral</text>
  
  <!-- Header to goal -->
  <path d="M 65 185 L 35 192" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  
  <!-- Defenders wall -->
  <circle cx="100" cy="155" r="7" fill="#e6edf3" fill-opacity="0.1" stroke="#e6edf3" stroke-width="1"/>
  <circle cx="105" cy="170" r="7" fill="#e6edf3" fill-opacity="0.1" stroke="#e6edf3" stroke-width="1"/>
  <circle cx="100" cy="185" r="7" fill="#e6edf3" fill-opacity="0.1" stroke="#e6edf3" stroke-width="1"/>
  
  <!-- GK Martínez -->
  <circle cx="45" cy="200" r="9" fill="#e6edf3" fill-opacity="0.15" stroke="#e6edf3" stroke-width="1.5"/>
  
  <!-- Goal indicator -->
  <text x="35" y="195" fill="#f85149" font-family="Arial, sans-serif" font-size="12" font-weight="bold">⚽</text>
  
  <!-- Extra time label -->
  <rect x="230" y="100" width="140" height="20" rx="4" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="300" y="114" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔄 AET</text>
  
  <!-- Score banner -->
  <rect x="200" y="360" width="200" height="30" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="380" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 2-2 CPV | 103' (AET)</text>
  
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  
  <style>
    text { dominant-baseline: central; }
  </style>
</svg>