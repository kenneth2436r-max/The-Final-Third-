<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <marker id="arrowShot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff0000"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- PITCH MARKINGS -->
  <rect x="25" y="40" width="550" height="320" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2" rx="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="28" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="2" fill="#fff" fill-opacity="0.4"/>
  <rect x="440" y="127" width="135" height="146" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="475" y="160" width="100" height="80" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="575" y="175" width="8" height="50" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="25" y="127" width="135" height="146" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="25" y="160" width="100" height="80" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="17" y="175" width="8" height="50" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Score banner -->
  <rect x="195" y="8" width="210" height="28" rx="14" fill="#000" fill-opacity="0.65"/>
  <text x="300" y="26" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 2-2 CPV</text>

  <!-- Timer badge -->
  <rect x="515" y="8" width="60" height="24" rx="12" fill="#000" fill-opacity="0.55"/>
  <text x="545" y="24" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">71'</text>

  <!-- G indicator on ARG goal -->
  <text x="28" y="185" fill="#ff0000" font-family="Arial, sans-serif" font-size="18" font-weight="bold">G</text>

  <!-- Event marker - Lopes Cabral shot position -->
  <circle cx="155" cy="200" r="10" fill="#22c55e" fill-opacity="0.6"/>
  <circle cx="155" cy="200" r="16" fill="none" stroke="#22c55e" stroke-width="2"/>

  <!-- Lopes Cabral -->
  <circle cx="155" cy="200" r="12" fill="#006600" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"/>
  <text x="155" y="200" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7" font-weight="bold">L.Cabral</text>

  <!-- Long shot trajectory -->
  <path d="M 155 200 Q 110 185 70 180 Q 45 178 30 185" fill="none" stroke="#ff0000" stroke-width="2.5" marker-end="url(#arrowShot)"/>

  <!-- Shot power indicator -->
  <text x="110" y="170" text-anchor="middle" fill="#ff0000" fill-opacity="0.7" font-family="Arial, sans-serif" font-size="8" font-style="italic">long-range strike</text>

  <!-- GK Martínez -->
  <circle cx="30" cy="200" r="10" fill="#f5c842" stroke="#d4a830" stroke-width="1.5"/>
  <text x="30" y="216" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7" style="text-shadow:1px 1px 2px #000;">Martínez</text>

  <!-- ARG defenders -->
  <circle cx="130" cy="178" r="7" fill="#66aaff" fill-opacity="0.7" stroke="#fff" stroke-width="1"/>
  <circle cx="135" cy="222" r="7" fill="#66aaff" fill-opacity="0.7" stroke="#fff" stroke-width="1"/>

  <!-- Description bar -->
  <rect x="155" y="360" width="290" height="28" rx="14" fill="#000" fill-opacity="0.6"/>
  <text x="300" y="378" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11">Cabral's long-range strike levels the match</text>

  <style>
    text { dominant-baseline: central; }
  </style>
</svg>