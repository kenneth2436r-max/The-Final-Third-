<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>

  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#fff" stroke-width="1.5" rx="4" opacity="0.45"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-width="1" opacity="0.45"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="4" fill="#fff" opacity="0.35"/>
  <rect x="40" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="40" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="510" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <rect x="557" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- Event location: Cabral drives forward on left flank -->
  <circle cx="120" cy="220" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="120" cy="220" r="14" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>

  <!-- Semedo pass -->
  <circle cx="200" cy="280" r="12" fill="#0d1117" stroke="#22c55e" stroke-width="1.5"/>
  <text x="200" y="277" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="6" font-weight="bold">Semedo</text>
  <text x="200" y="285" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="6">pass</text>

  <path d="M 195 270 Q 160 250 130 225" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="130,225 136,231 128,232" fill="#22c55e"/>

  <!-- Cabral drives forward -->
  <circle cx="110" cy="200" r="16" fill="#0d1117" stroke="#22c55e" stroke-width="2"/>
  <text x="110" y="195" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7" font-weight="bold">L. Cabral</text>
  <text x="110" y="205" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">drives infield</text>

  <path d="M 115 210 Q 130 215 140 200" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="140,200 136,208 144,207" fill="#22c55e"/>

  <!-- Cuts inside on edge of box -->
  <circle cx="140" cy="195" r="5" fill="#fff"/>
  <text x="145" y="190" fill="#8b949e" font-family="Arial, sans-serif" font-size="6">cuts inside</text>

  <!-- Curling shot -->
  <path d="M 145 195 Q 100 140 80 175" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="80,175 86,181 78,182" fill="#ffd700"/>

  <!-- Top corner text -->
  <text x="88" y="185" text-anchor="middle" fill="#ffd700" font-family="Arial, sans-serif" font-size="10" font-weight="bold">✨</text>
  <text x="88" y="172" text-anchor="middle" fill="#ffd700" font-family="Arial, sans-serif" font-size="6">top corner</text>

  <!-- Goal -->
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="39" y="205" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">G</text>

  <rect x="230" y="8" width="140" height="24" rx="12" fill="#000" opacity="0.6"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 2-2 CPV</text>

  <rect x="80" y="360" width="440" height="30" rx="6" fill="#000" opacity="0.6"/>
  <text x="300" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">103' Lopes Cabral curls an unbelievable strike into the far top corner</text>

  <rect x="475" y="45" width="70" height="22" rx="11" fill="#000" opacity="0.6"/>
  <text x="510" y="60" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">103' ET</text>
</svg>
