<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Barcola 2-0 (53')</text>

  <!-- Pitch top-down half -->
  <rect x="30" y="40" width="540" height="320" fill="none" stroke="#22c55e" stroke-width="1.5" rx="3"/>
  <rect x="30" y="40" width="270" height="320" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
  <rect x="510" y="40" width="60" height="320" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <rect x="530" y="110" width="40" height="180" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="550" y="150" width="20" height="100" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- Olise position (deep midfield) -->
  <circle cx="340" cy="250" r="7" fill="#22c55e" opacity="0.4"/>
  <text x="340" y="240" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Olise</text>

  <!-- Through ball -->
  <line x1="340" y1="250" x2="380" y2="170" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <polygon points="380,170 375,174 377,166" fill="#e6edf3" opacity="0.7"/>

  <!-- Barcola run -->
  <circle cx="380" cy="170" r="7" fill="#22c55e" opacity="0.6"/>
  <text x="380" y="160" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Barcola</text>

  <!-- Run arrow -->
  <line x1="340" y1="200" x2="380" y2="170" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.4"/>
  <polygon points="380,170 374,173 377,165" fill="#22c55e" opacity="0.4"/>

  <!-- Shot trajectory -->
  <line x1="380" y1="170" x2="555" y2="175" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="555,175 548,178 551,171" fill="#22c55e"/>

  <!-- Goal -->
  <text x="560" y="175" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">⚽</text>

  <!-- Scoreboard -->
  <rect x="200" y="370" width="200" height="22" rx="4" fill="#1a3c2a" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="385" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11" font-weight="bold">FRA 2-0 SWE · 53'</text>

  <!-- Label -->
  <text x="150" y="80" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="9" opacity="0.7">Olise through ball → Barcola run → finish</text>
</svg>
