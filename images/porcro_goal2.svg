<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="30" y="20" width="540" height="360" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="50" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Ronaldo Penalty — 1-1</text>
  <text x="300" y="68" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">68' — Leão fouled in the box</text>
  <!-- Mini pitch -->
  <rect x="80" y="80" width="440" height="260" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Pitch markings -->
  <rect x="80" y="130" width="440" height="160" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <line x1="300" y1="80" x2="300" y2="340" stroke="#30363d" stroke-width="0.5"/>
  <circle cx="300" cy="210" r="30" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Goal box left (attacking towards left) -->
  <rect x="80" y="155" width="50" height="110" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="80" y="175" width="35" height="70" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Goal box right -->
  <rect x="470" y="155" width="50" height="110" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="485" y="175" width="35" height="70" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Penalty area left -->
  <rect x="80" y="155" width="50" height="110" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Penalty spot -->
  <circle cx="115" cy="210" r="3" fill="#f0883e"/>
  <text x="115" y="195" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="7">PEN</text>
  <!-- Leão fouled position -->
  <circle cx="100" cy="205" r="5" fill="#e6edf3"/>
  <text x="100" y="193" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="6">Leão</text>
  <!-- Ronaldo at penalty spot -->
  <circle cx="115" cy="210" r="7" fill="#22c55e"/>
  <text x="115" y="225" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="6">Ronaldo</text>
  <!-- GK diving -->
  <circle cx="65" cy="180" r="5" fill="#58a6ff"/>
  <text x="65" y="172" text-anchor="middle" fill="#58a6ff" font-family="Arial,sans-serif" font-size="6">GK</text>
  <path d="M 65 180 Q 50 175 45 170" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Shot towards goal -->
  <path d="M 115 210 L 75 210" stroke="#22c55e" stroke-width="2.5"/>
  <path d="M 75 210 L 70 210" stroke="#22c55e" stroke-width="2"/>
  <text x="90" y="205" fill="#22c55e" font-family="Arial,sans-serif" font-size="7">Shot</text>
  <!-- Goal indicator -->
  <rect x="250" y="85" width="100" height="22" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="300" y="100" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">⚽ GOAL</text>
  <!-- PEN badge -->
  <rect x="470" y="80" width="50" height="22" rx="4" fill="#f0883e" opacity="0.2"/>
  <text x="495" y="95" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="11" font-weight="bold">PEN</text>
  <!-- Timer -->
  <circle cx="540" cy="40" r="16" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="540" y="45" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="10" font-weight="bold">68'</text>
  <!-- Scoreboard -->
  <rect x="240" y="355" width="120" height="28" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="270" y="374" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">POR</text>
  <text x="300" y="374" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">1 - 1</text>
  <text x="340" y="374" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">CRO</text>
  <!-- Foul indicator -->
  <text x="100" y="218" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="6">foul</text>
</svg>