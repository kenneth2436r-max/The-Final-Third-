<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="30" y="20" width="540" height="360" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="45" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Match Statistics</text>
  <text x="300" y="62" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="10">Portugal vs Croatia — Round of 32</text>
  <!-- Legend -->
  <rect x="170" y="75" width="12" height="12" rx="2" fill="#22c55e"/>
  <text x="186" y="85" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">Portugal</text>
  <rect x="370" y="75" width="12" height="12" rx="2" fill="#58a6ff"/>
  <text x="386" y="85" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">Croatia</text>
  <!-- Chart area -->
  <line x1="130" y1="100" x2="130" y2="365" stroke="#30363d" stroke-width="1"/>
  <line x1="130" y1="365" x2="540" y2="365" stroke="#30363d" stroke-width="1"/>
  <!-- Y-axis labels (0 to 100%) -->
  <text x="125" y="365" text-anchor="end" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">0</text>
  <text x="125" y="300" text-anchor="end" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">25</text>
  <text x="125" y="235" text-anchor="end" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">50</text>
  <text x="125" y="170" text-anchor="end" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">75</text>
  <text x="125" y="105" text-anchor="end" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">100</text>
  <line x1="130" y1="300" x2="540" y2="300" stroke="#30363d" stroke-width="0.3" stroke-dasharray="3,3"/>
  <line x1="130" y1="235" x2="540" y2="235" stroke="#30363d" stroke-width="0.3" stroke-dasharray="3,3"/>
  <line x1="130" y1="170" x2="540" y2="170" stroke="#30363d" stroke-width="0.3" stroke-dasharray="3,3"/>
  <line x1="130" y1="105" x2="540" y2="105" stroke="#30363d" stroke-width="0.3" stroke-dasharray="3,3"/>
  <!-- Helper: barWidth = 50, gap = 25, center of each group at 155, 240, 325, 410, 495 -->
  <!-- Bar positions for each stat (5 stats) -->
  <!-- Stat 1: Possession — POR 60%, CRO 40% -->
  <text x="155" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Poss</text>
  <rect x="118" y="236" width="30" height="129" rx="2" fill="#22c55e" opacity="0.8"/>
  <text x="133" y="233" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="8" font-weight="bold">60%</text>
  <rect x="162" y="300" width="30" height="65" rx="2" fill="#58a6ff" opacity="0.8"/>
  <text x="177" y="297" text-anchor="middle" fill="#58a6ff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">40%</text>
  <!-- Stat 2: Shots — POR 15, CRO 13 -->
  <text x="240" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Shots</text>
  <rect x="213" y="200" width="30" height="165" rx="2" fill="#22c55e" opacity="0.8"/>
  <text x="228" y="197" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="8" font-weight="bold">15</text>
  <rect x="257" y="218" width="30" height="147" rx="2" fill="#58a6ff" opacity="0.8"/>
  <text x="272" y="215" text-anchor="middle" fill="#58a6ff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">13</text>
  <!-- Stat 3: Shots on target — POR 3, CRO 6 -->
  <text x="325" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">SoT</text>
  <rect x="298" y="305" width="30" height="60" rx="2" fill="#22c55e" opacity="0.8"/>
  <text x="313" y="302" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="8" font-weight="bold">3</text>
  <rect x="342" y="261" width="30" height="104" rx="2" fill="#58a6ff" opacity="0.8"/>
  <text x="357" y="258" text-anchor="middle" fill="#58a6ff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">6</text>
  <!-- Stat 4: xG — POR 2.04, CRO 1.38 -->
  <text x="410" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">xG</text>
  <rect x="383" y="168" width="30" height="197" rx="2" fill="#22c55e" opacity="0.8"/>
  <text x="398" y="165" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="8" font-weight="bold">2.04</text>
  <rect x="427" y="232" width="30" height="133" rx="2" fill="#58a6ff" opacity="0.8"/>
  <text x="442" y="229" text-anchor="middle" fill="#58a6ff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">1.38</text>
  <!-- Stat 5: Passes — POR 585, CRO 370 -->
  <text x="495" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Passes</text>
  <rect x="468" y="200" width="30" height="165" rx="2" fill="#22c55e" opacity="0.8"/>
  <text x="483" y="197" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="8" font-weight="bold">585</text>
  <rect x="512" y="290" width="30" height="75" rx="2" fill="#58a6ff" opacity="0.8"/>
  <text x="527" y="287" text-anchor="middle" fill="#58a6ff" font-family="Arial,sans-serif" font-size="8" font-weight="bold">370</text>
</svg>