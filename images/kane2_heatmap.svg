<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="heatIntense" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatMedium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Harry Kane — Activity Heatmap</text>
  <!-- Pitch full markings -->
  <rect x="60" y="65" width="480" height="270" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <line x1="300" y1="65" x2="300" y2="335" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <circle cx="300" cy="200" r="32" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="60" y="110" width="95" height="180" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="445" y="110" width="95" height="180" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
  <rect x="60" y="145" width="50" height="110" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  <rect x="490" y="145" width="50" height="110" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
  <!-- Goal -->
  <rect x="540" y="175" width="8" height="50" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Heatmap zones -->
  <!-- Central attacking third (heavy presence) -->
  <circle cx="440" cy="190" r="65" fill="url(#heatIntense)"/>
  <!-- Box presence for both goals -->
  <circle cx="495" cy="180" r="35" fill="url(#heatIntense)"/>
  <circle cx="495" cy="215" r="30" fill="url(#heatIntense)"/>
  <!-- Dropping deep to receive -->
  <circle cx="370" cy="200" r="50" fill="url(#heatMedium)"/>
  <circle cx="320" cy="210" r="40" fill="url(#heatMedium)"/>
  <circle cx="280" cy="195" r="35" fill="url(#heatLight)"/>
  <!-- Left channel drifting -->
  <circle cx="200" cy="230" r="30" fill="url(#heatLight)"/>
  <!-- Goal markers -->
  <text x="533" y="178" text-anchor="middle" fill="#ff6b35" font-family="Arial,sans-serif" font-size="16" font-weight="bold">⚽</text>
  <text x="533" y="213" text-anchor="middle" fill="#ff6b35" font-family="Arial,sans-serif" font-size="16" font-weight="bold">⚽</text>
  <!-- Stats footer -->
  <rect x="140" y="355" width="320" height="35" rx="4" fill="#000" opacity="0.4" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <text x="300" y="368" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="10">2 Goals  |  Bellingham (A) + Palmer (A)  |  Man of the Match</text>
  <text x="300" y="382" text-anchor="middle" fill="#ffffff" opacity="0.6" font-family="Arial,sans-serif" font-size="8">Central attacking presence — dropping deep to link play — decisive in the box</text>
</svg>