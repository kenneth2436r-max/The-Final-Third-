<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Harry Kane — Activity Heatmap</text>

  <!-- Pitch outline -->
  <rect x="60" y="65" width="480" height="270" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="65" x2="300" y2="335" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <circle cx="300" cy="200" r="32" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <!-- Penalty areas -->
  <rect x="60" y="110" width="95" height="180" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <rect x="445" y="110" width="95" height="180" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <rect x="60" y="145" width="50" height="110" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.1"/>
  <rect x="490" y="145" width="50" height="110" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.1"/>
  <!-- Goal -->
  <rect x="540" y="175" width="8" height="50" fill="none" stroke="#e6edf3" stroke-width="1.5"/>

  <!-- Heatmap zones (radial gradients for natural heatmap look) -->
  <defs>
    <radialGradient id="hot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Central attacking zone (heavy presence) -->
  <circle cx="440" cy="190" r="65" fill="url(#hot1)"/>
  <!-- Box presence for both goals -->
  <circle cx="490" cy="180" r="35" fill="url(#hot1)"/>
  <circle cx="490" cy="215" r="30" fill="url(#hot1)"/>
  <!-- Dropping deep to receive -->
  <circle cx="370" cy="200" r="50" fill="url(#hot2)"/>
  <circle cx="320" cy="210" r="40" fill="url(#hot2)"/>
  <circle cx="280" cy="195" r="35" fill="url(#hot3)"/>
  <!-- Left channel drifting -->
  <circle cx="200" cy="230" r="30" fill="url(#hot3)"/>

  <!-- Goal markers -->
  <text x="530" y="178" text-anchor="middle" fill="#ff6b35" font-family="Arial,sans-serif" font-size="14" font-weight="bold">⚽</text>
  <text x="530" y="213" text-anchor="middle" fill="#ff6b35" font-family="Arial,sans-serif" font-size="14" font-weight="bold">⚽</text>

  <!-- Stats footer -->
  <rect x="140" y="355" width="320" height="35" rx="4" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="0.5"/>
  <text x="300" y="368" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">2 Goals  |  2 Assists (Gordon)  |  Man of the Match</text>
  <text x="300" y="382" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Central presence — dropping deep to link play — decisive in the box</text>
</svg>