<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#0d1117" rx="6"/>
  <text x="200" y="26" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700" font-family="Segoe UI,Arial,sans-serif">⚽ GOAL — Gakpo 72' (NED 1-0)</text>
  <text x="200" y="44" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Segoe UI,Arial,sans-serif">Summerville assist · De Jong initiated the transition</text>
  <line x1="20" y1="56" x2="380" y2="56" stroke="#2a2f37" stroke-width="0.5"/>
  <!-- Pitch view mini -->
  <rect x="40" y="70" width="320" height="190" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3" rx="2"/>
  <!-- Halfway line -->
  <line x1="200" y1="70" x2="200" y2="260" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Centre circle -->
  <circle cx="200" cy="165" r="20" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.2"/>
  <!-- Box -->
  <rect x="80" y="70" width="240" height="90" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Arrow 1: De Jong pass -->
  <defs>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>
  <!-- De Jong position -->
  <circle cx="170" cy="160" r="6" fill="#f59e0b" opacity="0.7"/>
  <text x="170" y="150" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="Segoe UI,Arial,sans-serif">De Jong</text>
  <!-- Summerville position -->
  <circle cx="100" cy="120" r="6" fill="#f59e0b" opacity="0.7"/>
  <text x="85" y="110" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="Segoe UI,Arial,sans-serif">Summerville</text>
  <!-- Gakpo position -->
  <circle cx="190" cy="90" r="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="190" y="93" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">11</text>
  <text x="190" y="80" text-anchor="middle" fill="#f59e0b" font-size="7" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Gakpo ⚽</text>
  <!-- Pass arrows -->
  <line x1="175" y1="155" x2="110" y2="125" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-yellow)"/>
  <text x="125" y="145" fill="#f59e0b" font-size="7" font-family="Segoe UI,Arial,sans-serif">① De Jong finds Summerville</text>
  <line x1="106" y1="118" x2="185" y2="95" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <text x="115" y="105" fill="#22c55e" font-size="7" font-family="Segoe UI,Arial,sans-serif">② Summerville slips Gakpo through</text>
  <!-- Goal icon -->
  <rect x="260" y="80" width="60" height="30" fill="#f59e0b" opacity="0.15" rx="4"/>
  <text x="290" y="99" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700" font-family="Segoe UI,Arial,sans-serif">GOAL</text>
  <!-- Narrative -->
  <text x="200" y="290" text-anchor="middle" fill="#cdd5dd" font-size="12" font-family="Segoe UI,Arial,sans-serif">Cody Gakpo finishes low across Bono into the far corner</text>
  <text x="200" y="306" text-anchor="middle" fill="#8b949e" font-size="10" font-family="Segoe UI,Arial,sans-serif">Emotional scenes as Gakpo scores days after announcing the loss of his unborn son</text>
</svg>