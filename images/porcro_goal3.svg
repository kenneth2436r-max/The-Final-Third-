<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="30" y="20" width="540" height="360" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="50" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Ramos Winner — 2-1</text>
  <text x="300" y="68" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">90+4' — Leão cross, Ramos header</text>
  <!-- Mini pitch -->
  <rect x="80" y="80" width="440" height="260" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Pitch markings -->
  <rect x="80" y="130" width="440" height="160" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <line x1="300" y1="80" x2="300" y2="340" stroke="#30363d" stroke-width="0.5"/>
  <circle cx="300" cy="210" r="30" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Goal box left -->
  <rect x="80" y="155" width="50" height="110" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="80" y="175" width="35" height="70" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Goal box right (attacking towards right) -->
  <rect x="470" y="155" width="50" height="110" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="485" y="175" width="35" height="70" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Penalty area right -->
  <rect x="470" y="155" width="50" height="110" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Leão cross from left wing -->
  <circle cx="130" cy="185" r="6" fill="#e6edf3"/>
  <text x="130" y="173" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="6">Leão</text>
  <path d="M 130 185 Q 250 160 470 185" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="300" y="157" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7">Cross</text>
  <!-- Ramos header -->
  <circle cx="465" cy="185" r="7" fill="#f0883e"/>
  <text x="465" y="173" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="6">Ramos</text>
  <!-- Header path -->
  <path d="M 465 185 L 490 185" stroke="#f0883e" stroke-width="2.5"/>
  <text x="475" y="200" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="7">Header</text>
  <!-- Ball in net -->
  <circle cx="495" cy="185" r="4" fill="#e6edf3"/>
  <!-- Net ripple -->
  <path d="M 500 185 Q 510 175 505 185 Q 510 195 500 185" fill="none" stroke="#e6edf3" stroke-width="1" opacity="0.5"/>
  <!-- Goal indicator -->
  <rect x="230" y="85" width="140" height="22" rx="4" fill="#22c55e" opacity="0.15"/>
  <text x="300" y="100" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">⚽ WINNER!</text>
  <!-- Timer -->
  <circle cx="540" cy="40" r="16" fill="none" stroke="#f0883e" stroke-width="1.5"/>
  <text x="540" y="45" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="9" font-weight="bold">90+4'</text>
  <!-- Scoreboard -->
  <rect x="240" y="355" width="120" height="28" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="270" y="374" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">POR</text>
  <text x="300" y="374" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">2 - 1</text>
  <text x="340" y="374" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">CRO</text>
  <!-- Sub indicator -->
  <rect x="420" y="80" width="80" height="22" rx="4" fill="#f0883e" opacity="0.15"/>
  <text x="460" y="95" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="9">Sub 62' ↑</text>
</svg>