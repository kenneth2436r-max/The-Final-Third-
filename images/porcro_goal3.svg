<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#cc0000"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- PITCH MARKINGS -->
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <circle cx="300" cy="200" r="36" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <circle cx="300" cy="200" r="3" fill="#fff" opacity="0.25"/>
  <rect x="0" y="120" width="88" height="160" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <rect x="0" y="160" width="35" height="80" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <circle cx="72" cy="200" r="2" fill="#fff" opacity="0.25"/>
  <path d="M 72 158 A 42 42 0 0 1 72 242" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <rect x="512" y="120" width="88" height="160" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <rect x="565" y="160" width="35" height="80" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <circle cx="528" cy="200" r="2" fill="#fff" opacity="0.25"/>
  <path d="M 528 158 A 42 42 0 0 0 528 242" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <rect x="0" y="176" width="6" height="48" fill="none" stroke="#fff" stroke-width="2" opacity="0.45"/>
  <rect x="594" y="176" width="6" height="48" fill="none" stroke="#fff" stroke-width="2" opacity="0.45"/>
  <path d="M 0 10 A 10 10 0 0 1 10 0" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <path d="M 590 0 A 10 10 0 0 1 600 10" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <path d="M 600 390 A 10 10 0 0 1 590 400" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <path d="M 10 400 A 10 10 0 0 1 0 390" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <!-- FELIX PASS -->
  <circle cx="360" cy="240" r="7" fill="none" stroke="#cc0000" stroke-width="1.5"/>
  <text x="360" y="255" text-anchor="middle" fill="#cc0000" font-family="Arial,sans-serif" font-size="7">Félix</text>
  <path d="M 360 240 Q 430 225 475 200" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" marker-end="url(#arrowGreen)"/>
  <text x="430" y="238" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="8" opacity="0.7">Pass</text>
  <!-- RAMOS MOVE -->
  <path d="M 420 280 Q 450 240 475 200" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="455" y="270" text-anchor="middle" fill="#cc0000" font-family="Arial,sans-serif" font-size="7">Ramos run</text>
  <!-- EVENT MARKER -->
  <circle cx="478" cy="198" r="18" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
  <circle cx="478" cy="198" r="10" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="478" cy="198" r="4" fill="#22c55e"/>
  <text x="478" y="183" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7">Ramos</text>
  <!-- VOLLEY SHOT -->
  <path d="M 478 198 L 590 198" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="535" y="191" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7">Volley</text>
  <!-- BALL IN NET -->
  <circle cx="592" cy="198" r="3" fill="#fff"/>
  <path d="M 598 198 Q 602 191 600 198 Q 602 205 598 198" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <!-- SCORE BANNER -->
  <rect x="175" y="8" width="250" height="30" rx="15" fill="#000" opacity="0.75"/>
  <text x="228" y="28" text-anchor="middle" fill="#cc0000" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Portugal</text>
  <text x="300" y="28" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="bold">2 - 1</text>
  <text x="372" y="28" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Croatia</text>
  <!-- TIMER BADGE -->
  <rect x="525" y="8" width="60" height="24" rx="12" fill="#000" opacity="0.75"/>
  <text x="555" y="25" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">81'</text>
  <!-- SUB BADGE -->
  <rect x="440" y="8" width="60" height="24" rx="12" fill="#22c55e" opacity="0.3"/>
  <text x="470" y="25" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="10" font-weight="bold">62' SUB</text>
  <!-- DESCRIPTION BAR -->
  <rect x="100" y="365" width="400" height="26" rx="4" fill="#000" opacity="0.65"/>
  <text x="300" y="382" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="11">Ramos 81' — Volley from Félix pass (edge of box)</text>
</svg>