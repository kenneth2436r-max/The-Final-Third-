<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <rect x="30" y="20" width="540" height="360" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="48" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Gonçalo Ramos — Activity Heatmap</text>
  <text x="300" y="65" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="10">Substitute: 62' → 90+4' • 28 minutes played</text>
  <!-- Pitch -->
  <rect x="100" y="80" width="400" height="260" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Halfway line -->
  <line x1="300" y1="80" x2="300" y2="340" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="300" cy="210" r="25" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <!-- Penalty areas -->
  <rect x="100" y="145" width="50" height="130" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="100" y="170" width="35" height="80" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <rect x="450" y="145" width="50" height="130" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="465" y="170" width="35" height="80" fill="none" stroke="#30363d" stroke-width="0.5"/>
  <!-- Heatmap zones — central attacking area -->
  <ellipse cx="430" cy="195" rx="55" ry="55" fill="#22c55e" opacity="0.35"/>
  <ellipse cx="445" cy="185" rx="35" ry="35" fill="#22c55e" opacity="0.55"/>
  <ellipse cx="455" cy="180" rx="18" ry="18" fill="#22c55e" opacity="0.8"/>
  <ellipse cx="415" cy="220" rx="25" ry="20" fill="#22c55e" opacity="0.25"/>
  <ellipse cx="460" cy="200" rx="15" ry="12" fill="#22c55e" opacity="0.7"/>
  <!-- Box activity zone -->
  <rect x="455" y="175" width="40" height="75" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  <text x="475" y="168" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7" opacity="0.7">Box activity</text>
  <!-- Header goal marker -->
  <circle cx="465" cy="185" r="5" fill="#f0883e"/>
  <text x="465" y="173" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="6">⚽ 90+4'</text>
  <!-- Movement arrows -->
  <path d="M 370 220 Q 400 200 430 195" fill="none" stroke="#e6edf3" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <path d="M 400 230 Q 420 210 440 200" fill="none" stroke="#e6edf3" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <!-- Intensity legend -->
  <rect x="140" y="360" width="12" height="8" rx="1" fill="#22c55e" opacity="0.25"/>
  <rect x="160" y="360" width="12" height="8" rx="1" fill="#22c55e" opacity="0.5"/>
  <rect x="180" y="360" width="12" height="8" rx="1" fill="#22c55e" opacity="0.8"/>
  <text x="200" y="367" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Low → High activity</text>
  <!-- Stats summary -->
  <g transform="translate(370, 355)">
    <rect x="0" y="0" width="120" height="35" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="14" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Goals: 1</text>
    <text x="60" y="14" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Min: 28</text>
    <text x="10" y="27" fill="#22c55e" font-family="Arial,sans-serif" font-size="8">90+4' Winner</text>
  </g>
</svg>