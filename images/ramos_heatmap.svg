<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>
  <!-- PITCH MARKINGS -->
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <circle cx="300" cy="200" r="36" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <circle cx="300" cy="200" r="3" fill="#fff" opacity="0.25"/>
  <rect x="0" y="120" width="88" height="160" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <rect x="0" y="160" width="35" height="80" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <circle cx="72" cy="200" r="2" fill="#fff" opacity="0.25"/>
  <path d="M 72 158 A 42 42 0 0 1 72 242" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <rect x="512" y="120" width="88" height="160" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <rect x="565" y="160" width="35" height="80" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <circle cx="528" cy="200" r="2" fill="#fff" opacity="0.25"/>
  <path d="M 528 158 A 42 42 0 0 0 528 242" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <rect x="0" y="176" width="6" height="48" fill="none" stroke="#fff" stroke-width="2" opacity="0.45"/>
  <rect x="594" y="176" width="6" height="48" fill="none" stroke="#fff" stroke-width="2" opacity="0.45"/>
  <path d="M 0 10 A 10 10 0 0 1 10 0" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <path d="M 590 0 A 10 10 0 0 1 600 10" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <path d="M 600 390 A 10 10 0 0 1 590 400" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <path d="M 10 400 A 10 10 0 0 1 0 390" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.25"/>
  <!-- TITLE -->
  <rect x="160" y="8" width="280" height="28" rx="14" fill="#000" opacity="0.6"/>
  <text x="300" y="27" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Gonçalo Ramos — Activity Heatmap</text>
  <!-- SUB INFO -->
  <text x="300" y="48" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="9" opacity="0.6">Substitute: 62' → 81' • 19 minutes played • 1 goal</text>
  <!-- HEATMAP ZONES — CENTRAL ATTACKING THIRD -->
  <ellipse cx="450" cy="190" rx="65" ry="55" fill="#22c55e" opacity="0.2"/>
  <ellipse cx="470" cy="185" rx="45" ry="40" fill="#22c55e" opacity="0.35"/>
  <ellipse cx="485" cy="195" rx="30" ry="30" fill="#22c55e" opacity="0.55"/>
  <ellipse cx="495" cy="188" rx="16" ry="16" fill="#22c55e" opacity="0.75"/>
  <ellipse cx="430" cy="160" rx="20" ry="15" fill="#22c55e" opacity="0.15"/>
  <ellipse cx="420" cy="220" rx="25" ry="18" fill="#22c55e" opacity="0.15"/>
  <!-- BOX ACTIVITY ZONE -->
  <rect x="520" y="170" width="40" height="70" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="540" y="163" text-anchor="middle" fill="#22c55e" font-family="Arial,sans-serif" font-size="7" opacity="0.6">Box zone</text>
  <!-- GOAL MARKER -->
  <circle cx="500" cy="185" r="6" fill="#f0883e"/>
  <circle cx="500" cy="185" r="10" fill="none" stroke="#f0883e" stroke-width="1.5" opacity="0.5"/>
  <text x="500" y="172" text-anchor="middle" fill="#f0883e" font-family="Arial,sans-serif" font-size="7">81' ⚽</text>
  <!-- MOVEMENT ARROWS -->
  <path d="M 350 230 Q 400 210 440 195" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <path d="M 380 250 Q 420 220 460 200" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  <path d="M 450 250 Q 470 220 485 200" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3,3" opacity="0.25"/>
  <!-- INTENSITY LEGEND -->
  <rect x="140" y="362" width="12" height="8" rx="1" fill="#22c55e" opacity="0.2"/>
  <rect x="158" y="362" width="12" height="8" rx="1" fill="#22c55e" opacity="0.4"/>
  <rect x="176" y="362" width="12" height="8" rx="1" fill="#22c55e" opacity="0.7"/>
  <text x="195" y="370" fill="#fff" font-family="Arial,sans-serif" font-size="8" opacity="0.6">Low → High activity</text>
  <!-- STATS CARD -->
  <rect x="370" y="355" width="130" height="34" rx="4" fill="#000" opacity="0.5"/>
  <text x="380" y="370" fill="#fff" font-family="Arial,sans-serif" font-size="8" opacity="0.7">Goals: 1</text>
  <text x="440" y="370" fill="#fff" font-family="Arial,sans-serif" font-size="8" opacity="0.7">Min: 19</text>
  <text x="380" y="382" fill="#22c55e" font-family="Arial,sans-serif" font-size="8">81' Winner (volley)</text>
</svg>