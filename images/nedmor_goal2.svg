<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#0d1117" rx="6"/>
  <text x="200" y="26" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700" font-family="Segoe UI,Arial,sans-serif">⚽ GOAL — Diop 90+1' (1-1)</text>
  <text x="200" y="44" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Segoe UI,Arial,sans-serif">Hakimi cross · Stoppage-time equaliser</text>
  <line x1="20" y1="56" x2="380" y2="56" stroke="#2a2f37" stroke-width="0.5"/>
  <!-- Pitch view mini -->
  <rect x="40" y="70" width="320" height="190" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3" rx="2"/>
  <line x1="200" y1="70" x2="200" y2="260" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="200" cy="165" r="20" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.2"/>
  <rect x="80" y="100" width="240" height="90" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3"/>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="arrow-cross" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>
  <!-- Hakimi position -->
  <circle cx="90" cy="150" r="6" fill="#22c55e" opacity="0.7"/>
  <text x="90" y="140" text-anchor="middle" fill="#22c55e" font-size="7" font-family="Segoe UI,Arial,sans-serif">Hakimi</text>
  <!-- Cross arrow -->
  <path d="M95 148 Q140 110 170 105" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-cross)"/>
  <text x="115" y="120" fill="#22c55e" font-size="7" font-family="Segoe UI,Arial,sans-serif">pinpoint cross</text>
  <!-- Diop position -->
  <circle cx="180" cy="102" r="8" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="180" y="105" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">14</text>
  <text x="180" y="92" text-anchor="middle" fill="#22c55e" font-size="7" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Diop ⚽</text>
  <!-- Van Dijk marking gap -->
  <circle cx="180" cy="130" r="5" fill="#f59e0b" opacity="0.5"/>
  <text x="180" y="145" text-anchor="middle" fill="#f59e0b" font-size="6" font-family="Segoe UI,Arial,sans-serif">v. Dijk peeled</text>
  <line x1="180" y1="135" x2="180" y2="108" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow-red)"/>
  <!-- Netherlands box -->
  <rect x="130" y="95" width="60" height="18" fill="#ef4444" opacity="0.15" rx="3"/>
  <text x="160" y="107" text-anchor="middle" fill="#ef4444" font-size="8" font-weight="600" font-family="Segoe UI,Arial,sans-serif">NEAR POST</text>
  <!-- Narrative -->
  <text x="200" y="290" text-anchor="middle" fill="#cdd5dd" font-size="12" font-family="Segoe UI,Arial,sans-serif">Diop rises unchallenged at the near post, glancing header past Verbruggen</text>
  <text x="200" y="306" text-anchor="middle" fill="#8b949e" font-size="10" font-family="Segoe UI,Arial,sans-serif">Dutch legs tired; Hakimi found space where the 3-4-2-1 leaves full-backs isolated</text>
</svg>