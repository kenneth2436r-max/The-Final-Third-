<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#0d1117" rx="6"/>
  <text x="200" y="26" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700" font-family="Segoe UI,Arial,sans-serif">🧤 SAVE OF THE TOURNAMENT — Verbruggen 96'</text>
  <text x="200" y="44" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Segoe UI,Arial,sans-serif">Denies Rahimi from point-blank range in extra time</text>
  <line x1="20" y1="56" x2="380" y2="56" stroke="#2a2f37" stroke-width="0.5"/>
  <!-- Goal view -->
  <rect x="40" y="70" width="320" height="180" fill="none" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.3" rx="2"/>
  <!-- Goal frame -->
  <rect x="140" y="70" width="120" height="72" fill="none" stroke="#e6edf3" stroke-width="2" rx="1"/>
  <!-- Net pattern -->
  <line x1="145" y1="76" x2="255" y2="76" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <line x1="145" y1="86" x2="255" y2="86" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <line x1="145" y1="96" x2="255" y2="96" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <line x1="145" y1="106" x2="255" y2="106" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <line x1="145" y1="116" x2="255" y2="116" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <line x1="145" y1="126" x2="255" y2="126" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <line x1="145" y1="136" x2="255" y2="136" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <line x1="200" y1="70" x2="200" y2="142" stroke="#e6edf3" stroke-width="0.3" opacity="0.2"/>
  <!-- Verbruggen -->
  <circle cx="200" cy="135" r="16" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
  <text x="200" y="139" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">1</text>
  <text x="200" y="124" text-anchor="middle" fill="#f59e0b" font-size="7" font-family="Segoe UI,Arial,sans-serif">Verbruggen</text>
  <!-- Save hand -->
  <line x1="185" y1="125" x2="165" y2="115" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Rahimi -->
  <circle cx="180" cy="95" r="6" fill="#22c55e" opacity="0.7"/>
  <text x="180" y="88" text-anchor="middle" fill="#22c55e" font-size="7" font-family="Segoe UI,Arial,sans-serif">Rahimi</text>
  <!-- Shot arrow -->
  <line x1="182" y1="98" x2="195" y2="130" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
  <text x="155" y="115" fill="#ef4444" font-size="7" font-family="Segoe UI,Arial,sans-serif">low drive</text>
  <!-- Deflection indicator -->
  <path d="M195 130 Q175 140 160 145" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <text x="145" y="155" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">SAVED!</text>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
  </defs>
  <!-- Narrative -->
  <text x="200" y="280" text-anchor="middle" fill="#cdd5dd" font-size="12" font-family="Segoe UI,Arial,sans-serif">Verbruggen spreads perfectly, strong left hand deflects wide</text>
  <text x="200" y="296" text-anchor="middle" fill="#8b949e" font-size="10" font-family="Segoe UI,Arial,sans-serif">Rahimi through one-on-one; the save that kept Netherlands alive</text>
</svg>