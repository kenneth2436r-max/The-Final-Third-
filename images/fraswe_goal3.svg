<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Mbappé 3-0 (74')</text>

  <!-- Pitch top-down half -->
  <rect x="30" y="40" width="540" height="320" fill="none" stroke="#22c55e" stroke-width="1.5" rx="3"/>
  <rect x="30" y="40" width="270" height="320" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
  <rect x="510" y="40" width="60" height="320" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <rect x="530" y="110" width="40" height="180" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="550" y="150" width="20" height="100" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- Olise position -->
  <circle cx="310" cy="220" r="7" fill="#22c55e" opacity="0.4"/>
  <text x="310" y="210" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Olise</text>

  <!-- Pass 1 -->
  <line x1="310" y1="220" x2="370" y2="180" stroke="#e6edf3" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <polygon points="370,180 365,184 367,176" fill="#e6edf3" opacity="0.7"/>

  <!-- Mbappé run -->
  <circle cx="370" cy="180" r="8" fill="#22c55e" opacity="0.7"/>
  <text x="370" y="170" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Mbappé</text>

  <!-- Run path -->
  <path d="M 310 260 Q 340 230, 370 180" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Shot trajectory -->
  <path d="M 370 180 C 420 175, 480 170, 555 165" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="555,165 548,168 551,161" fill="#22c55e"/>

  <!-- Goal -->
  <text x="560" y="165" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="10">⚽</text>

  <!-- Scoreboard -->
  <rect x="200" y="370" width="200" height="22" rx="4" fill="#1a3c2a" stroke="#22c55e" stroke-width="1"/>
  <text x="300" y="385" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="11" font-weight="bold">FRA 3-0 SWE · 74'</text>

  <!-- Label -->
  <text x="150" y="80" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="9" opacity="0.7">Olise assist → Mbappé run &amp; finish</text>
</svg>
