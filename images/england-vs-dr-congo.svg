<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="leftBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="50%" stop-color="#1a1a2d"/>
      <stop offset="100%" stop-color="#26263d"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00001a"/>
      <stop offset="50%" stop-color="#00002d"/>
      <stop offset="100%" stop-color="#05053d"/>
    </linearGradient>
    <radialGradient id="team1Glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="team2Glow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2266ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2266ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="distress">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="dramaticGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- DR Congo kit stripes -->
    <pattern id="codKit" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0033aa"/>
      <rect x="0" y="0" width="4" height="8" fill="#ffcc00" opacity="0.3"/>
    </pattern>
    <g id="crest1">
      <rect x="-10" y="-12" width="20" height="24" rx="3" fill="#000"/>
      <rect x="-8" y="-10" width="16" height="20" rx="2" fill="#cc0000"/>
      <text x="0" y="2" text-anchor="middle" font-family="Arial" font-weight="900" font-size="6" fill="#fff">ENG</text>
    </g>
    <g id="crest2">
      <rect x="-10" y="-12" width="20" height="24" rx="3" fill="#000"/>
      <rect x="-8" y="-10" width="16" height="20" rx="2" fill="#0033aa"/>
      <text x="0" y="2" text-anchor="middle" font-family="Arial" font-weight="900" font-size="5" fill="#fff">COD</text>
    </g>
    <g id="player1">
      <path d="M-8,15 Q-12,10 -10,0 Q-8,-12 0,-15 Q8,-12 10,0 Q12,10 8,15 L6,40 Q4,50 2,55 L-2,55 Q-4,50 -6,40 Z" fill="#f0f0f0"/>
      <circle cx="0" cy="-22" r="10" fill="#f5d6b8"/>
      <rect x="-4" y="-12" width="8" height="5" fill="#f5d6b8"/>
      <path d="M-9,2 Q-16,6 -18,14 Q-19,18 -16,19" stroke="#f0f0f0" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M9,2 Q16,4 19,10 Q21,14 18,16" stroke="#f0f0f0" stroke-width="5" fill="none" stroke-linecap="round"/>
      <rect x="-7" y="40" width="14" height="8" rx="2" fill="#0022aa"/>
      <path d="M-3,48 L-5,65 Q-6,68 -3,68 L-1,68 Q0,66 0,62" stroke="#0022aa" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M3,48 L5,65 Q6,68 3,68 L1,68 Q0,66 0,62" stroke="#0022aa" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="-11" y="0" width="4" height="6" rx="1" fill="#f0f0f0"/>
      <rect x="7" y="0" width="4" height="6" rx="1" fill="#f0f0f0"/>
      <rect x="-4.5" y="62" width="3" height="6" rx="1" fill="#f0f0f0"/>
      <rect x="1.5" y="62" width="3" height="6" rx="1" fill="#f0f0f0"/>
      <rect x="-5.5" y="67" width="4" height="3" rx="1" fill="#000"/>
      <rect x="1.5" y="67" width="4" height="3" rx="1" fill="#000"/>
      <use href="#crest1" x="0" y="-5"/>
    </g>
    <g id="player2">
      <path d="M-8,15 Q-12,10 -10,0 Q-8,-12 0,-15 Q8,-12 10,0 Q12,10 8,15 L6,40 Q4,50 2,55 L-2,55 Q-4,50 -6,40 Z" fill="url(#codKit)"/>
      <circle cx="0" cy="-22" r="10" fill="#8B7355"/>
      <rect x="-4" y="-12" width="8" height="5" fill="#8B7355"/>
      <path d="M-9,2 Q-16,4 -19,10 Q-21,14 -18,16" stroke="url(#codKit)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M9,2 Q16,6 18,14 Q19,18 16,19" stroke="url(#codKit)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <rect x="-7" y="40" width="14" height="8" rx="2" fill="#ffcc00"/>
      <path d="M-3,48 L-5,65 Q-6,68 -3,68 L-1,68 Q0,66 0,62" stroke="#ffcc00" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M3,48 L5,65 Q6,68 3,68 L1,68 Q0,66 0,62" stroke="#ffcc00" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="-11" y="0" width="4" height="6" rx="1" fill="#0033aa"/>
      <rect x="7" y="0" width="4" height="6" rx="1" fill="#0033aa"/>
      <rect x="-4.5" y="62" width="3" height="6" rx="1" fill="#0033aa"/>
      <rect x="1.5" y="62" width="3" height="6" rx="1" fill="#0033aa"/>
      <rect x="-5.5" y="67" width="4" height="3" rx="1" fill="#000"/>
      <rect x="1.5" y="67" width="4" height="3" rx="1" fill="#000"/>
      <use href="#crest2" x="0" y="-5"/>
    </g>
    <g id="lightningBolt">
      <path d="M-4,-20 L-10,0 L-2,0 L-8,20 L6,2 L-2,2 L4,-20 Z" fill="#ffffff" filter="url(#dramaticGlow)"/>
    </g>
    <g id="spark">
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.4"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    </g>
    <g id="spark2">
      <circle cx="0" cy="0" r="1.5" fill="#2266ff" opacity="0.6"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#2266ff" stroke-width="0.5" opacity="0.3"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#2266ff" stroke-width="0.5" opacity="0.3"/>
    </g>
  </defs>

  <rect x="0" y="0" width="400" height="800" fill="url(#leftBg)"/><rect x="0" y="0" width="400" height="800" fill="url(#team1Glow)"/>
  <use href="#spark" x="50" y="120"/><use href="#spark" x="120" y="180"/><use href="#spark" x="80" y="300"/>
  <use href="#spark" x="180" y="90"/><use href="#spark" x="60" y="500"/><use href="#spark" x="150" y="400"/>
  <rect x="400" y="0" width="400" height="800" fill="url(#rightBg)"/><rect x="400" y="0" width="400" height="800" fill="url(#team2Glow)"/>
  <use href="#spark2" x="500" y="120"/><use href="#spark2" x="620" y="180"/><use href="#spark2" x="550" y="300"/>

  <line x1="400" y1="40" x2="400" y2="760" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

  <rect x="300" y="38" width="200" height="1" fill="#22c55e" opacity="0.6"/>
  <text x="400" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="4">ROUND OF 32</text>
  <rect x="280" y="65" width="240" height="1" fill="#22c55e" opacity="0.4"/>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="9" fill="#8b949e" letter-spacing="3">FIFA WORLD CUP 2026™</text>

  <g transform="translate(180, 160) scale(1.6)"><use href="#player1"/><text x="-3" y="-4" text-anchor="middle" font-family="Arial" font-weight="900" font-size="7" fill="#000" opacity="0.6">10</text></g>
  <g transform="translate(160, 320) scale(2.0)"><use href="#player1"/><text x="0" y="-3" text-anchor="middle" font-family="Arial" font-weight="900" font-size="8" fill="#000" opacity="0.6">9</text></g>
  <g transform="translate(90, 370) scale(1.7)"><use href="#player1"/></g>
  <g transform="translate(240, 380) scale(1.5)"><use href="#player1"/></g>

  <g transform="translate(620, 160) scale(1.6)"><use href="#player2"/></g>
  <g transform="translate(640, 320) scale(2.0)"><use href="#player2"/></g>
  <g transform="translate(710, 370) scale(1.7)"><use href="#player2"/></g>
  <g transform="translate(560, 380) scale(1.5)"><use href="#player2"/></g>

  <rect x="0" y="540" width="800" height="120" fill="#000" opacity="0.6"/>
  <text x="180" y="600" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="6" filter="url(#distress)">ENGLAND</text>
  <g transform="translate(400, 583) scale(1.2)"><use href="#lightningBolt"/></g>
  <text x="400" y="600" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="22" fill="#ffffff" filter="url(#dramaticGlow)">Vs</text>
  <text x="620" y="600" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="38" fill="#2266ff" letter-spacing="6" filter="url(#distress)">DR CONGO</text>

  <text x="180" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#8b949e" letter-spacing="3">KANE | BELLINGHAM | PALMER</text>
  <text x="620" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#8b949e" letter-spacing="3">BAKAMBU | ELIA | MUBAMA</text>

  <rect x="0" y="670" width="800" height="50" fill="#000"/>
  <rect x="2" y="672" width="796" height="46" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  <text x="400" y="699" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#ffd700" letter-spacing="4">TACTICAL PREVIEW &amp; FULL MATCH ANALYSIS</text>
</svg>
