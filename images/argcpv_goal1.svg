<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>

  <rect x="40" y="40" width="520" height="320" fill="none" stroke="#fff" stroke-width="1.5" rx="4" opacity="0.45"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#fff" stroke-width="1" opacity="0.45"/>
  <rect x="40" y="130" width="520" height="140" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="45" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
  <circle cx="300" cy="200" r="4" fill="#fff" opacity="0.35"/>
  <rect x="460" y="140" width="100" height="120" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <rect x="510" y="175" width="50" height="50" fill="none" stroke="#fff" stroke-width="1" opacity="0.25"/>
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <rect x="557" y="180" width="8" height="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- Event location - Messi run into box from central area -->
  <circle cx="480" cy="200" r="6" fill="#66aaff" opacity="0.8"/>
  <circle cx="480" cy="200" r="14" fill="none" stroke="#66aaff" stroke-width="1.5" opacity="0.5"/>

  <!-- L. Martínez long ball from midfield -->
  <circle cx="280" cy="280" r="14" fill="#0d1117" stroke="#66aaff" stroke-width="2"/>
  <text x="280" y="276" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7" font-weight="bold">L. Martínez</text>
  <text x="280" y="285" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">long ball</text>

  <!-- Long ball trajectory -->
  <path d="M 285 270 Q 350 180 470 190" fill="none" stroke="#66aaff" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="470,190 462,185 464,196" fill="#66aaff"/>
  <circle cx="460" cy="192" r="5" fill="#fff"/>

  <!-- Messi control and finish -->
  <circle cx="490" cy="200" r="16" fill="#0d1117" stroke="#66aaff" stroke-width="2"/>
  <text x="490" y="195" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Messi</text>
  <text x="490" y="205" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">control + finish</text>

  <!-- Shot into roof of net -->
  <path d="M 500 195 Q 520 185 560 185" fill="none" stroke="#66aaff" stroke-width="2"/>
  <polygon points="560,185 552,180 553,190" fill="#66aaff"/>

  <!-- Vozinha drawn out -->
  <circle cx="545" cy="190" r="12" fill="#0d1117" stroke="#22c55e" stroke-width="1.5"/>
  <text x="545" y="187" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="7" font-weight="bold">Vozinha</text>
  <text x="545" y="196" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="6">drawn out</text>

  <!-- Goal -->
  <rect x="35" y="180" width="8" height="40" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="39" y="205" text-anchor="middle" fill="#ff6b6b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">G</text>

  <rect x="230" y="8" width="140" height="24" rx="12" fill="#000" opacity="0.6"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">ARG 1-0 CPV</text>

  <rect x="120" y="360" width="360" height="30" rx="6" fill="#000" opacity="0.6"/>
  <text x="300" y="380" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">29' Messi controls L. Martínez's long ball and smashes into roof of net</text>

  <rect x="490" y="45" width="55" height="22" rx="11" fill="#000" opacity="0.6"/>
  <text x="517" y="60" text-anchor="middle" fill="#66aaff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">29'</text>
</svg>
