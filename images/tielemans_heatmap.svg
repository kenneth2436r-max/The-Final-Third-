<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Pitch background -->
  <rect width="600" height="400" fill="#1a472a"/>
  <defs>
    <pattern id="pitchPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <rect x="0" y="0" width="1" height="20" fill="#000" opacity="0.08"/>
      <rect x="0" y="0" width="20" height="1" fill="#000" opacity="0.08"/>
    </pattern>
    <radialGradient id="pitchVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="hot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="hot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.02"/>
    </radialGradient>
    <radialGradient id="hot3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.01"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pitchPattern)" opacity="0.12"/>
  <rect width="600" height="400" fill="url(#pitchVignette)"/>

  <!-- Pitch markings -->
  <rect x="70" y="45" width="460" height="280" fill="none" stroke="#fff" stroke-width="1" rx="3" opacity="0.4"/>
  <line x1="300" y1="45" x2="300" y2="325" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <rect x="70" y="120" width="460" height="130" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="300" cy="185" r="45" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="300" cy="185" r="3" fill="#fff" opacity="0.3"/>
  <rect x="70" y="110" width="90" height="150" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.25"/>
  <rect x="440" y="110" width="90" height="150" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.25"/>

  <!-- Heatmap zones - Tielemans: central midfield focus -->
  <ellipse cx="300" cy="180" rx="65" ry="50" fill="url(#hot1)"/>
  <ellipse cx="340" cy="170" rx="50" ry="55" fill="url(#hot2)"/>
  <ellipse cx="350" cy="115" rx="40" ry="30" fill="url(#hot2)"/>
  <ellipse cx="370" cy="95" rx="25" ry="18" fill="url(#hot3)"/>
  <ellipse cx="280" cy="240" rx="45" ry="35" fill="url(#hot3)"/>
  <ellipse cx="250" cy="180" rx="35" ry="40" fill="url(#hot3)"/>
  <ellipse cx="400" cy="190" rx="30" ry="45" fill="url(#hot3)"/>
  <ellipse cx="375" cy="125" rx="30" ry="22" fill="url(#hot2)"/>
  <ellipse cx="390" cy="110" rx="20" ry="14" fill="url(#hot1)"/>
  <ellipse cx="395" cy="118" rx="14" ry="10" fill="url(#hot1)"/>

  <!-- Title -->
  <rect x="180" y="8" width="240" height="24" rx="12" fill="#000" opacity="0.6"/>
  <text x="300" y="24" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Tielemans — Activity Heatmap</text>

  <!-- Stats panel -->
  <rect x="30" y="345" width="540" height="48" rx="6" fill="#000" opacity="0.6"/>
  <text x="70" y="372" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">120 min</text>
  <line x1="130" y1="352" x2="130" y2="386" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <text x="145" y="372" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2 Goals</text>
  <line x1="215" y1="352" x2="215" y2="386" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <text x="230" y="372" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">1 Penalty won</text>
  <line x1="340" y1="352" x2="340" y2="386" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <text x="355" y="372" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">89' equaliser</text>
  <line x1="460" y1="352" x2="460" y2="386" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <text x="475" y="372" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">120+5' winner</text>

  <!-- Color scale -->
  <rect x="470" y="50" width="10" height="10" rx="2" fill="#22c55e" opacity="0.25"/>
  <text x="484" y="60" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">Low</text>
  <rect x="520" y="50" width="10" height="10" rx="2" fill="#22c55e" opacity="0.85"/>
  <text x="534" y="60" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">High</text>
</svg>
