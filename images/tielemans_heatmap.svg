<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <text x="300" y="28" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Youri Tielemans — Activity Heatmap</text>
  
  <!-- Pitch shape for heatmap -->
  <rect x="100" y="50" width="400" height="280" fill="none" stroke="#30363d" stroke-width="1" rx="3"/>
  <line x1="300" y1="50" x2="300" y2="330" stroke="#30363d" stroke-width="1"/>
  <rect x="100" y="125" width="400" height="130" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="300" cy="190" r="50" fill="none" stroke="#30363d" stroke-width="0.8"/>
  
  <!-- Heatmap areas using gradients -->
  <defs>
    <radialGradient id="hot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="hot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.02"/>
    </radialGradient>
    <radialGradient id="hot3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.02"/>
    </radialGradient>
  </defs>
  
  <!-- Central midfield - hottest zone -->
  <ellipse cx="300" cy="190" rx="70" ry="55" fill="url(#hot1)"/>
  
  <!-- Right central area -->
  <ellipse cx="340" cy="180" rx="50" ry="60" fill="url(#hot2)"/>
  
  <!-- Forward runs into box -->
  <ellipse cx="350" cy="120" rx="40" ry="35" fill="url(#hot2)"/>
  <ellipse cx="370" cy="100" rx="25" ry="20" fill="url(#hot3)"/>
  
  <!-- Defensive coverage -->
  <ellipse cx="280" cy="250" rx="45" ry="35" fill="url(#hot3)"/>
  
  <!-- Left side activity -->
  <ellipse cx="250" cy="190" rx="35" ry="40" fill="url(#hot3)"/>
  
  <!-- Right flank -->
  <ellipse cx="400" cy="200" rx="30" ry="50" fill="url(#hot3)"/>
  
  <!-- Box presence -->
  <ellipse cx="380" cy="130" rx="30" ry="25" fill="url(#hot2)"/>
  <ellipse cx="395" cy="115" rx="20" ry="15" fill="url(#hot1)"/>
  
  <!-- Penalty spot area -->
  <ellipse cx="400" cy="120" rx="15" ry="10" fill="url(#hot1)"/>
  
  <!-- Halfway line marker -->
  <line x1="300" y1="50" x2="300" y2="330" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="3,3"/>
  
  <!-- Penalty area outline -->
  <rect x="100" y="115" width="80" height="150" fill="none" stroke="#30363d" stroke-width="0.8"/>
  <rect x="420" y="115" width="80" height="150" fill="none" stroke="#30363d" stroke-width="0.8"/>
  
  <!-- Stats panel -->
  <rect x="30" y="350" width="540" height="42" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  
  <text x="70" y="374" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">120 min</text>
  <line x1="130" y1="356" x2="130" y2="390" stroke="#30363d" stroke-width="1"/>
  
  <text x="145" y="374" fill="#22c55e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">2 Goals</text>
  <line x1="215" y1="356" x2="215" y2="390" stroke="#30363d" stroke-width="1"/>
  
  <text x="230" y="374" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">1 Penalty won</text>
  <line x1="340" y1="356" x2="340" y2="390" stroke="#30363d" stroke-width="1"/>
  
  <text x="355" y="374" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">89' equaliser</text>
  <line x1="460" y1="356" x2="460" y2="390" stroke="#30363d" stroke-width="1"/>
  
  <text x="475" y="374" fill="#8b949e" font-family="Arial, sans-serif" font-size="10">120+5' winner</text>
  
  <!-- Color scale -->
  <rect x="470" y="55" width="12" height="12" rx="2" fill="#22c55e" opacity="0.3"/>
  <text x="486" y="66" fill="#8b949e" font-family="Arial, sans-serif" font-size="8">Low</text>
  <rect x="520" y="55" width="12" height="12" rx="2" fill="#22c55e" opacity="0.9"/>
  <text x="536" y="66" fill="#8b949e" font-family="Arial, sans-serif" font-size="8">High</text>
</svg>
