<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Match Statistics</text>
  
  <!-- Legend -->
  <rect x="140" y="40" width="14" height="14" rx="2" fill="#22c55e"/>
  <text x="158" y="52" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11">Argentina</text>
  <rect x="340" y="40" width="14" height="14" rx="2" fill="#f85149"/>
  <text x="358" y="52" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11">Cape Verde</text>
  
  <!-- Chart area -->
  <g transform="translate(60, 80)">
    
    <!-- Background grid lines -->
    <line x1="60" y1="0" x2="60" y2="280" stroke="#30363d" stroke-width="1"/>
    <line x1="60" y1="70" x2="480" y2="70" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="60" y1="140" x2="480" y2="140" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="60" y1="210" x2="480" y2="210" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="60" y1="280" x2="480" y2="280" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
    
    <!-- Max value scale -->
    <text x="50" y="74" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="9">100%</text>
    <text x="50" y="144" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="9">75%</text>
    <text x="50" y="214" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="9">50%</text>
    <text x="50" y="284" text-anchor="end" fill="#8b949e" font-family="Arial, sans-serif" font-size="9">0%</text>
    
    <!-- Bar spacing: each category group at 60, 140, 220, 300, 380 -->
    
    <!-- Possession: ARG 59% = 165, CPV 34% = 95 -->
    <!-- Bar: y = (1 - val%) * 280; height = val% * 280 -->
    <!-- ARG bar x=60, CPV bar x=220 -->
    
    <!-- 1. Possession -->
    <text x="150" y="15" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Possession</text>
    
    <rect x="90" y="112" width="40" height="168" rx="3" fill="#22c55e" fill-opacity="0.8"/>
    <text x="110" y="102" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">59%</text>
    
    <rect x="170" y="185" width="40" height="95" rx="3" fill="#f85149" fill-opacity="0.8"/>
    <text x="190" y="178" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="10" font-weight="bold">34%</text>
    
    <!-- 2. Shots -->
    <g transform="translate(140, 0)">
      <text x="150" y="15" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Shots</text>
      
      <!-- ARG 22 out of 30 max ~ 73% = 0.73*280=205 height, y=75 -->
      <rect x="90" y="75" width="40" height="205" rx="3" fill="#22c55e" fill-opacity="0.8"/>
      <text x="110" y="68" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">22</text>
      
      <!-- CPV 16 = 0.53*280=149, y=131 -->
      <rect x="170" y="131" width="40" height="149" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="190" y="124" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="10" font-weight="bold">16</text>
    </g>
    
    <!-- 3. Shots on target -->
    <g transform="translate(280, 0)">
      <text x="150" y="15" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11" font-weight="bold">SOT</text>
      
      <!-- ARG 12 out of 15 max = 0.8*280=224, y=56 -->
      <rect x="90" y="56" width="40" height="224" rx="3" fill="#22c55e" fill-opacity="0.8"/>
      <text x="110" y="49" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">12</text>
      
      <!-- CPV 5 = 0.33*280=93, y=187 -->
      <rect x="170" y="187" width="40" height="93" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="190" y="180" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="10" font-weight="bold">5</text>
    </g>
    
    <!-- 4. Passes -->
    <g transform="translate(420, 0)">
      <text x="150" y="15" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Passes</text>
      
      <!-- ARG 862, normalize to max 900 = 0.956*280=268, y=12 -->
      <rect x="90" y="12" width="40" height="268" rx="3" fill="#22c55e" fill-opacity="0.8"/>
      <text x="110" y="5" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="9" font-weight="bold">862</text>
      
      <!-- CPV 491 = 0.545*280=153, y=127 -->
      <rect x="170" y="127" width="40" height="153" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="190" y="120" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="9" font-weight="bold">491</text>
    </g>
    
    <!-- 5. Corners -->
    <g transform="translate(560, 0)">
      <text x="150" y="15" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Corners</text>
      
      <!-- Both 8, max 10 = 0.8*280=224, y=56 -->
      <rect x="90" y="56" width="40" height="224" rx="3" fill="#22c55e" fill-opacity="0.8"/>
      <text x="110" y="49" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="10" font-weight="bold">8</text>
      
      <rect x="170" y="56" width="40" height="224" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="190" y="49" text-anchor="middle" fill="#f85149" font-family="Arial, sans-serif" font-size="10" font-weight="bold">8</text>
    </g>
    
  </g>
  
  <style>
    text { dominant-baseline: central; }
  </style>
</svg>