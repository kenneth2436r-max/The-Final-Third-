<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  <text x="300" y="30" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="18" font-weight="bold">France 4-3-3</text>

  <!-- Pitch -->
  <rect x="50" y="45" width="500" height="310" fill="none" stroke="#22c55e" stroke-width="1.5" rx="3"/>
  <line x1="50" y1="200" x2="550" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="200" r="35" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <rect x="250" y="45" width="100" height="155" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <rect x="250" y="200" width="100" height="155" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>

  <!-- GK -->
  <circle cx="300" cy="55" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="300" y="59" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Maignan</text>

  <!-- DEF -->
  <circle cx="500" cy="130" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="500" y="134" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Koundé</text>

  <circle cx="390" cy="140" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="390" y="144" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Saliba</text>

  <circle cx="210" cy="140" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="210" y="144" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Upamecano</text>

  <circle cx="100" cy="130" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="100" y="134" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Digne</text>

  <!-- MID -->
  <circle cx="460" cy="230" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="460" y="234" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Rabiot</text>

  <circle cx="300" cy="250" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="300" y="254" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Tchouaméni</text>

  <circle cx="140" cy="230" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="234" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Olise</text>

  <!-- FWD -->
  <circle cx="480" cy="330" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="334" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Dembélé</text>

  <circle cx="300" cy="345" r="16" fill="#1a3c2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="300" y="349" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7">Barcola</text>

  <circle cx="120" cy="330" r="18" fill="#2a5c3a" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="334" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="7" font-weight="bold">Mbappé</text>
  <text x="120" y="310" text-anchor="middle" fill="#e6edf3" font-family="Arial,sans-serif" font-size="6" font-style="italic">(c)</text>
</svg>
