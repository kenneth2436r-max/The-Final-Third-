<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Pitch -->
  <rect width="400" height="520" fill="url(#pitch)" rx="6"/>
  <!-- Pitch markings -->
  <rect x="20" y="20" width="360" height="480" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3" rx="3"/>
  <line x1="20" y1="260" x2="380" y2="260" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="200" cy="260" r="30" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Boxes -->
  <rect x="80" y="20" width="240" height="120" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="80" y="380" width="240" height="120" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Header -->
  <rect x="0" y="0" width="400" height="36" fill="#22c55e" rx="6"/>
  <rect x="0" y="20" width="400" height="16" fill="#22c55e"/>
  <text x="200" y="24" text-anchor="middle" fill="#04210f" font-size="13" font-weight="700" font-family="Segoe UI,Arial,sans-serif">NETHERLANDS — 3-4-2-1</text>
  <!-- Players (attacking top, GK bottom) -->
  <!-- GK - Verbruggen -->
  <circle cx="200" cy="460" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="200" y="464" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">1</text>
  <text x="200" y="480" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Verbruggen</text>
  <!-- Back 3 -->
  <circle cx="100" cy="380" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="100" y="384" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">6</text>
  <text x="100" y="400" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">v. Hecke</text>
  <circle cx="200" cy="390" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="200" y="394" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">4</text>
  <text x="200" y="410" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Van Dijk (C)</text>
  <circle cx="300" cy="380" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="300" y="384" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">5</text>
  <text x="300" y="400" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Ake</text>
  <!-- Midfield 4 -->
  <circle cx="70" cy="290" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="70" y="294" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">15</text>
  <text x="70" y="310" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">v. de Ven</text>
  <circle cx="140" cy="270" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="140" y="274" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">8</text>
  <text x="140" y="290" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Gravenberch</text>
  <circle cx="260" cy="270" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="260" y="274" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">21</text>
  <text x="260" y="290" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">De Jong</text>
  <circle cx="330" cy="290" r="14" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="330" y="294" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">22</text>
  <text x="330" y="310" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Dumfries</text>
  <!-- Attacking 3 -->
  <circle cx="120" cy="180" r="14" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="120" y="184" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">24</text>
  <text x="120" y="200" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Summerville</text>
  <circle cx="280" cy="180" r="14" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="280" y="184" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">11</text>
  <text x="280" y="200" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Gakpo</text>
  <!-- Striker -->
  <circle cx="200" cy="120" r="14" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="200" y="124" text-anchor="middle" fill="#04210f" font-size="8" font-weight="700" font-family="Segoe UI,Arial,sans-serif">19</text>
  <text x="200" y="140" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Brobbey</text>
  <!-- Direction arrow -->
  <text x="200" y="70" text-anchor="middle" fill="#22c55e" font-size="10" font-family="Segoe UI,Arial,sans-serif" opacity="0.5">▲ ATTACKING DIRECTION</text>
</svg>