<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#0d1117"/>
  
  <!-- Pitch outline -->
  <rect x="60" y="40" width="480" height="320" fill="none" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#30363d" stroke-width="1.5"/>
  <rect x="60" y="140" width="480" height="120" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="50" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="200" r="4" fill="#30363d"/>
  <rect x="60" y="120" width="120" height="160" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="420" y="120" width="120" height="160" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Senegal 4-3-3</text>
  
  <!-- Connecting lines - defensive line -->
  <line x1="130" y1="280" x2="200" y2="280" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="280" x2="300" y2="280" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="280" x2="400" y2="280" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="280" x2="470" y2="280" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  
  <!-- Connecting lines - midfield line -->
  <line x1="220" y1="220" x2="300" y2="220" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="220" x2="380" y2="220" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  
  <!-- Connecting lines - forward line -->
  <line x1="160" y1="160" x2="300" y2="160" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="160" x2="440" y2="160" stroke="#e6edf3" stroke-width="1" opacity="0.3"/>
  
  <!-- GK - Diaw -->
  <circle cx="300" cy="330" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="326" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Diaw</text>
  <text x="300" y="338" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">GK</text>
  
  <!-- DEF -->
  <circle cx="130" cy="280" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="130" y="276" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Diatta</text>
  <text x="130" y="288" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">RB</text>
  
  <circle cx="200" cy="280" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="276" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Ciss</text>
  <text x="200" y="288" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">CB</text>
  
  <circle cx="300" cy="280" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="276" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Niakhaté</text>
  <text x="300" y="288" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">CB</text>
  
  <circle cx="400" cy="280" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="276" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Jakobs</text>
  <text x="400" y="288" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">LB</text>
  
  <circle cx="470" y="280" r="15" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
  <text x="470" y="284" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="9">DEF</text>
  
  <!-- MID -->
  <circle cx="220" cy="220" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="220" y="216" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">H. Diarra</text>
  <text x="220" y="228" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">CM</text>
  
  <circle cx="300" cy="220" r="24" fill="#1a2332" stroke="#22c55e" stroke-width="2.5"/>
  <text x="300" y="215" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">I. Gueye</text>
  <text x="300" y="227" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">CM (C)</text>
  
  <circle cx="380" cy="220" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="380" y="216" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">P. Gueye</text>
  <text x="380" y="228" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">CM</text>
  
  <!-- FWD -->
  <circle cx="160" cy="160" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="160" y="156" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">I. Ndiaye</text>
  <text x="160" y="168" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">LW</text>
  
  <circle cx="300" cy="140" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="136" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Sarr</text>
  <text x="300" y="148" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">ST</text>
  
  <circle cx="440" cy="160" r="22" fill="#1a2332" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="156" text-anchor="middle" fill="#e6edf3" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Mané</text>
  <text x="440" y="168" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="7">RW</text>
  
  <!-- Attacking direction arrow -->
  <polygon points="300,370 290,360 310,360" fill="#22c55e" opacity="0.5"/>
  <line x1="300" y1="365" x2="300" y2="380" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
</svg>
